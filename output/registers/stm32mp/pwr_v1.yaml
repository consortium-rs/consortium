fieldset/PWR_CR2:
  description: ''
  fields:
    - name: MONEN
      bit_offset: 0
      bit_size: 1
      description: 'VBAT and temperature monitoring enableWhen set, the VBAT supply
        and temperature monitoring is enabled.- 0: VBAT and temperature monitoring disabled.-
        1: VBAT and temperature monitoring enabled.'
    - name: VBATL
      bit_offset: 8
      bit_size: 1
      description: 'Monitored VBAT level above low threshold- 0: VBAT level above low
        threshold level, or Monitor disabled.- 1: VBAT level equal or below low threshold
        level.'
    - name: VBATH
      bit_offset: 9
      bit_size: 1
      description: 'Monitored VBAT level above high threshold- 0: VBAT level below high
        threshold level, or Monitor disabled.- 1: VBAT level equal or above high threshold
        level.'
    - name: TEMPL
      bit_offset: 10
      bit_size: 1
      description: 'Monitored temperature level above low threshold- 0: Temperature
        above low threshold level, or Monitor disabled.- 1: Temperature equal or below
        low threshold level.'
    - name: TEMPH
      bit_offset: 11
      bit_size: 1
      description: 'Monitored temperature level above high threshold- 0: Temperature
        below high threshold level, or Monitor disabled.- 1: Temperature equal or above
        high threshold level.'
fieldset/PWR_CR3:
  description: ''
  fields:
    - name: PVDEN
      bit_offset: 0
      bit_size: 1
      description: 'Programmable Voltage detector enable.This bit is read only when
        the SYSCFG register bit PVDL is set. (When PVDL is set, there will be no bus
        errors generated when writing this register).- 0: Programmable Voltage detector
        disabled.- 1: Programmable Voltage detector enabled.'
    - name: PVDO
      bit_offset: 8
      bit_size: 1
      description: 'Programmable Voltage Detect OutputThis bit is set and cleared by
        hardware. It is valid only if PVD is enabled by the PVDEN bit.- 0: VDD or voltage
        level on PVD_IN is equal or higher than the PVD threshold selected with the
        PLS[2:0] bits.- 1: VDD or voltage level on PVD_IN is lower than the PVD threshold
        selected with the PLS[2:0] bits.The PVD is disabled in Standby mode and after
        a system reset. For this reason, this bit is equal to 0 after Standby and system
        reset.'
fieldset/PWR_CR5:
  description: ''
  fields:
    - name: VCOREMONEN
      bit_offset: 0
      bit_size: 1
      description: 'VDDCORE monitoring enable.When set, the VDDCORE supply monitoring
        is enabled.- 0: VDDCORE monitoring disabled.- 1: VDDCORE monitoring enabled.'
    - name: VCOREL
      bit_offset: 8
      bit_size: 1
      description: 'Monitored VDDCORE level above low threshold.- 0: VDDCORE level above
        low threshold level, or Monitor disabled.- 1: VDDCORE level equal or below low
        threshold level.'
    - name: VCOREH
      bit_offset: 9
      bit_size: 1
      description: 'Monitored VDDCORE level above high threshold.- 0: VDDCORE level
        below high threshold level, or Monitor disabled.- 1: VDDCORE level equal or
        above high threshold level.'
fieldset/PWR_CR6:
  description: ''
  fields:
    - name: VCPUMONEN
      bit_offset: 0
      bit_size: 1
      description: 'VDDCPU monitoring enable.When set, the VDDCPU supply monitoring
        is enabled.- 0: VDDCPU monitoring disabled.- 1: VDDCPU monitoring enabled.'
    - name: VCPULLS
      bit_offset: 4
      bit_size: 1
      description: VDDCPU Voltage Detector low level selection.This bit select the low
        voltage threshold detected by the monitoring.
    - name: VCPUL
      bit_offset: 8
      bit_size: 1
      description: 'Monitored VDDCPU level above low threshold.- 0: VDDCPU level above
        low threshold level, or Monitor disabled.- 1: VDDCPU level equal or below low
        threshold level.'
    - name: VCPUH
      bit_offset: 9
      bit_size: 1
      description: 'Monitored VDDCPU level above high threshold.- 0: VDDCPU level below
        high threshold level, or Monitor disabled.- 1: VDDCPU level equal or above high
        threshold level.'
