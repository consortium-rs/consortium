fieldset/PWR_RSECCFGR:
  description: ''
  fields:
    - name: RSEC0
      bit_offset: 0
      bit_size: 1
      description: 'Secure attribute reference for the local resource number x (x =
        0)These bits are written by software to enabled the secure mode for the local
        resource x.- 0: The local resource number x is non-secure. Secure access is
        also possible.- 1: The local resource number x is secure only.This bit can only
        be written by secure application. If corresponding PRIVx bit is set in PWR_RPRIVCFGR
        this bit can only be written by secure privileged application.If compartment
        filtering for this local resource is enabled by setting CFEN bit in PWR_RxCIDCFGR,
        only an allowed compartment can write this bit, on top of secure and privileged
        restriction.'
    - name: RSEC1
      bit_offset: 1
      bit_size: 1
      description: Secure attribute reference for the local resource number x (x = 1)See
        RSEC0 for details.
    - name: RSEC2
      bit_offset: 2
      bit_size: 1
      description: Secure attribute reference for the local resource number x (x = 2)See
        RSEC0 for details.
    - name: RSEC3
      bit_offset: 3
      bit_size: 1
      description: Secure attribute reference for the local resource number x (x = 3)See
        RSEC0 for details.
    - name: RSEC4
      bit_offset: 4
      bit_size: 1
      description: Secure attribute reference for the local resource number x (x = 4)See
        RSEC0 for details.
    - name: RSEC5
      bit_offset: 5
      bit_size: 1
      description: Secure attribute reference for the local resource number x (x = 5)See
        RSEC0 for details.
    - name: RSEC6
      bit_offset: 6
      bit_size: 1
      description: Secure attribute reference for the local resource number x (x = 6)See
        RSEC0 for details.
