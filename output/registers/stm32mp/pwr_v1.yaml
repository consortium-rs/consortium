fieldset/PWR_CPU1D1SR:
  description: ''
  fields:
    - name: CSTATE
      bit_offset: 2
      bit_size: 2
      description: 'CPU1 cluster state status.Set by hardware to indicate when the CPU1
        is in CRun, CSleep or CStop modes.- 00: CPU1 is in reset (Hold_boot or Wfben).-
        01: CPU1 is in CRun state.- 10: CPU1 is in CSleep state.- 11: CPU1 is in CStop
        state.'
    - name: DSTATE
      bit_offset: 8
      bit_size: 3
      description: 'D1 domain state status.Set by hardware to indicate when the D1 domain
        is in DRun, DStop1/2/3 or DStandby mode.- 000: DRun- 001: DStop1- 010: DStop2-
        011: DStop3- 100: DStandby'
fieldset/PWR_CPU2D2SR:
  description: ''
  fields:
    - name: WFBEN
      bit_offset: 1
      bit_size: 1
      description: "CPU2 Wait for boot enable status flag.Set by hardware to indicate\
        \ when the CPU2 is in wait for boot enable state. Only applicable in Wakeup\
        \ event mode.- 0: CPU2 is not in wait for boot enable state. Set at \xE2\x80\
        \x980\xE2\x80\x99 in legacy boot mode.- 1: CPU2 is in wait for boot enable state.\
        \ It will start once an event assign to him will be raised.Refer to RCC specification\
        \ for details on HOLD_BOOT processor state."
    - name: CSTATE
      bit_offset: 2
      bit_size: 2
      description: 'CPU2 cluster state status flag.Set by hardware to indicate when
        the CPU2 is in CRun, CSleep or CStop states.- 00: CPU2 is in reset (Hold_boot
        or Wfben).- 01: CPU2 is in CRun state.- 10: CPU2 is in CSleep state.- 11: CPU2
        is in CStop state.'
    - name: DSTATE
      bit_offset: 8
      bit_size: 3
      description: 'System / D2 state status.Set by hardware to indicate when the system
        / D2 domain is in Run, Stop, LP-Stop, LPLV-Stop, Standby and VBAT modes.- 000:
        Run- 001: Stop- 010: LP-Stop- 011: LPLV-Stop- 100: Standby- 101: VBAT'
fieldset/PWR_CPU3D3SR:
  description: ''
  fields:
    - name: CSTATE
      bit_offset: 2
      bit_size: 2
      description: 'CPU3 cluster state status flag.Set by hardware to indicate when
        the CPU3 is in CRun, CSleep or CStop states.- 00: CPU3 is in reset.- 01: CPU3
        is in CRun state.- 10: CPU3 is in CSleep state.- 11: CPU3 is in CStop state.'
    - name: DSTATE
      bit_offset: 8
      bit_size: 3
      description: 'D3 state status.Set by hardware to indicate when the D3 domain is
        in SRun1/2/3, SStop1/2 and SStandby modes.- 000: SRun1- 001: SRun2- 010: SRun3-
        011: SStop1- 100: SStop2- 101: SStandby (only accessible in Debug standby mode)'
