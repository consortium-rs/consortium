fieldset/PWR_CR8:
  description: ''
  fields:
    - name: VDDIO1VMEN
      bit_offset: 0
      bit_size: 1
      description: Bit fields for PWR_CR9 register
    - name: VDDIO1SV
      bit_offset: 8
      bit_size: 1
      description: Bit fields for PWR_CR9 register
    - name: VDDIO1RDY
      bit_offset: 16
      bit_size: 1
      description: Bit fields for PWR_CR9 register
    - name: VDDIO1VRSEL
      bit_offset: 24
      bit_size: 1
      description: Bit fields for PWR_CR9 register
    - name: VDDIO1VRSTBY
      bit_offset: 25
      bit_size: 1
      description: Bit fields for PWR_CR9 register
fieldset/PWR_CR9:
  description: ''
  fields:
    - name: BKPRBSEN
      bit_offset: 0
      bit_size: 1
      description: 'Backup RAM backup supply enable (used to maintain BKP RAM content
        in Standby and VBAT modes).When set, the backup ram is supplied from backup
        regulator in Standby and VBAT modes.When reset, The backup ram can still be
        used in Run and Stop modes but its content will be lost in Standby and VBAT
        modes.- 0: BKPSRAM Backup supply disable.- 1: BKPSRAM Backup supply enable.'
    - name: LPR1BSEN
      bit_offset: 4
      bit_size: 1
      description: 'LPSRAM 1 backup supply enable (used to maintain LPSRAM1 RAM content
        in Standby and VBAT modes).When set, the LPSRAM1 is supplied from backup regulator
        in Standby and VBAT modes.When reset, The LPSRAM1 can still be used in Run and
        Stop modes but its content will be lost in Standby and VBAT modes.- 0: LPSRAM1
        Backup supply disable.- 1: LPSRAM1 Backup supply enable.'
fieldset/PWR_CR10:
  description: ''
  fields:
    - name: RETRBSEN
      bit_offset: 0
      bit_size: 2
      description: 'Retention RAM backup supply enable (used to maintain RET RAM content
        in Standby and VBAT modes).When set, the retention ram is supplied from backup
        regulator in Standby and VBAT modes. When reset, the retention ram can still
        be used in Run and Stop modes but its content will be lost in Standby and VBAT
        modes.- 00: RETRAM Backup supply disable.- 01: RETRAM Backup supply enable in
        Standby and VBAT modes.- 10: RETRAM Backup supply enable only in Standby mode
        (memory content lost in VBAT mode).- 11: RETRAM Backup supply enable only in
        Standby mode (memory content lost in VBAT mode).'
fieldset/PWR_CR11:
  description: ''
  fields:
    - name: DDRRETDIS
      bit_offset: 0
      bit_size: 1
      description: Bit fields for PWR_CR12 register
fieldset/PWR_CR12:
  description: ''
  fields:
    - name: GPUVMEN
      bit_offset: 0
      bit_size: 1
      description: VDDGPU independent GPU voltage monitor enable
    - name: GPULVTEN
      bit_offset: 1
      bit_size: 1
      description: VDDGPU low voltage threshold enable
    - name: GPUSV
      bit_offset: 8
      bit_size: 1
      description: VDDGPU independent supply valid
    - name: VDDGPURDY
      bit_offset: 16
      bit_size: 1
      description: VDDGPU ready
fieldset/PWR_BDCR1:
  description: ''
  fields:
    - name: DBD3P
      bit_offset: 0
      bit_size: 1
      description: 'Disable backup and D3 domains write protection.In reset state, all
        registers in backup and D3 domains are protected against parasitic write access
        from D1 and D2 domains. This bit must be set to enable write access to these
        registers.- 0: Write access to backup and D3 domains disabled- 1: Write access
        to backup and D3 domains enabled'
fieldset/PWR_BDCR2:
  description: ''
  fields:
    - name: DBP
      bit_offset: 0
      bit_size: 1
      description: 'Disable backup domain write protection.In reset state, all registers
        in backup domain are protected against parasitic write access from D3 domain.
        This bit must be set to enable write access to these registers.- 0: Write access
        to backup domains disabled- 1: Write access to backup domains enabled'
fieldset/PWR_CPU1CR:
  description: ''
  fields:
    - name: VBF
      bit_offset: 4
      bit_size: 1
      description: 'VBAT exit FlagThis bit is set by hardware and cleared only by a
        Vsw POR reset or by setting the CPU1 CSSF bit. (not reset when exit from VBAT)-
        0: System has not been in VBAT mode.- 1: System has been in VBAT mode.'
    - name: STOPF
      bit_offset: 5
      bit_size: 1
      description: 'System Stop FlagThis bit is set by hardware and cleared only by
        any system reset or by setting the CPU1 CSSF bit.- 0: System has not been in
        Stop mode.- 1: System has been in Stop mode, clock system has been stopped.'
    - name: SBF
      bit_offset: 6
      bit_size: 1
      description: 'System Standby FlagThis bit is set by hardware and cleared only
        by a VDD POR reset or by setting the CPU1 and CPU2 CSSF bit. (not reset when
        exit from Standby mode)- 0: System has not been in Standby mode.- 1: System
        has been in Standby mode, system contents has been lost.'
    - name: CSSF
      bit_offset: 9
      bit_size: 1
      description: 'Clear CPU1 STOPF, SBF_D1/_D3, SBF, VBF flags and CPU2 SBF flag.(Always
        read as 0)This bit is reset on any system reset.- 0: No effect.- 1: When written,
        clear the CPU1 flags (STOPF, SBF_D1/_D3, SBF, and VBF) and CPU2 SBF flag. Register
        bit is cleared to 0 by hardware.'
    - name: STANDBYWFIL2
      bit_offset: 15
      bit_size: 1
      description: 'CPU1 system idle indication.This bit is set and reset by HW based
        on the CPU1 operation mode.- 0: CPU1 system active.- 1: CPU1 system idle.'
fieldset/PWR_CPU2CR:
  description: ''
  fields:
    - name: VBF
      bit_offset: 4
      bit_size: 1
      description: 'VBAT exit FlagThis bit is set by hardware and cleared only by a
        Vsw POR reset or by setting the CPU1 CSSF bit. (not reset when exit from VBAT)-
        0: System has not been in VBAT mode.- 1: System has been in VBAT mode.'
    - name: STOPF
      bit_offset: 5
      bit_size: 1
      description: 'System Stop FlagThis bit is set by hardware and cleared only by
        any system reset or by setting the CPU2 CSSF bit.- 0: System has not been in
        Stop mode.- 1: System has been in Stop mode, clock system has been stopped.'
    - name: SBF
      bit_offset: 6
      bit_size: 1
      description: 'System Standby FlagThis bit is set by hardware and cleared only
        by a VDD POR reset or by setting the CPU2 and CPU1 CSSF bit. (not reset when
        exit from Standby mode)- 0: System has not been in Standby mode- 1: System has
        been in Standby mode, system contents has been lost.'
    - name: CSSF
      bit_offset: 9
      bit_size: 1
      description: 'Clear CPU2 STOPF, SBF_D2, SBF_D3, SBF, VBF flags and CPU1 SBF flag.(Always
        read as 0)This bit is reset on any system reset.- 0: No effect.- 1: When written,
        clear the CPU2 flags (STOPF, SBF_D2, SBF_D3, SBF and VBF) and CPU1 SBF flag.
        Register bit is cleared to 0 by hardware.'
    - name: DEEPSLEEP
      bit_offset: 15
      bit_size: 1
      description: 'CPU2 system idle indication.This bit is set and reset by HW based
        on the CPU2 operation mode.- 0: CPU2 system active.- 1: CPU2 system idle.'
fieldset/PWR_CPU3CR:
  description: ''
  fields:
    - name: VBF
      bit_offset: 4
      bit_size: 1
      description: 'VBAT exit FlagThis bit is set by hardware and cleared only by a
        Vsw POR reset or by setting the CPU3 CSSF bit. (not reset when exit from VBAT)-
        0: System has not been in VBAT mode.- 1: System has been in VBAT mode.'
    - name: CSSF
      bit_offset: 9
      bit_size: 1
      description: 'Clear CPU3 SBF_D3, VBF flag.(Always read as 0)This bit is reset
        on any system reset.- 0: No effect.- 1: When written, clear the CPU3 flag (SBF_D3
        and VBF). Register bit is cleared to 0 by hardware.'
    - name: DEEPSLEEP
      bit_offset: 15
      bit_size: 1
      description: 'CPU3 system idle indication.This bit is set and reset by HW based
        on the CPU3 operation mode.- 0: CPU3 active.- 1: CPU3 idle.'
fieldset/PWR_D3CR:
  description: ''
  fields:
    - name: D3RDY
      bit_offset: 31
      bit_size: 1
      description: 'D3 domain supply ready.This bit is set when the domain is accessible-
        0: D3 domain not ready- 1: D3 domain ready.'
fieldset/PWR_WKUPCR1:
  description: ''
  fields:
    - name: WKUPC
      bit_offset: 0
      bit_size: 1
      description: 'Clear Wakeup Flag for WKUPx pin.These bits are always read as 0.-
        0: No effect- 1: Writing 1 will clear the WKUPFx Wakeup Flag. (Bit is cleared
        to 0 by HW)'
    - name: WKUPP
      bit_offset: 8
      bit_size: 1
      description: 'Wakeup Polarity bit for WKUPx pinThese bits define the polarity
        used for event detection on external wake-up WKUPx pin- 0: Detection on high
        level (rising edge)- 1: Detection on low level (falling edge)'
    - name: WKUPPUPD
      bit_offset: 12
      bit_size: 2
      description: 'Wakeup pull configuration for WKUPx pin.These bits define the IO
        pad pull configuration used when WKUPENCPU1 or/and WKUPENCPU2 = 1. (note that
        the associated GPIO port pull configuration shall be set to the same value or
        00). The Wakeup Pin pull configuration will be maintained in Standby mode.-
        00: No pulls- 01: Pull-up- 10: Pull-down- 11: Reserved'
    - name: WKUPENCPU1
      bit_offset: 16
      bit_size: 1
      description: 'Enable Wakeup WKUPx pin and interrupt for CPU1.- 0: An event on
        WKUPx pin does not wakeup the system from Standby and Stop modes, nor generate
        an interrupt to CPU1.- 1: A rising or falling edge on WKUPx pin wakes-up the
        system from Standby and Stop modes and generate an interrupt to CPU1.'
    - name: WKUPENCPU2
      bit_offset: 17
      bit_size: 1
      description: 'Enable Wakeup WKUPx pin and interrupt for CPU2.- 0: An event on
        WKUPx pin does not wakeup the system from Standby and Stop modes, nor generate
        an interrupt to CPU2.- 1: A rising or falling edge on WKUPx pin wakes-up the
        system from Standby and Stop modes and generate an interrupt to CPU2.'
    - name: WKUPF
      bit_offset: 31
      bit_size: 1
      description: 'Wakeup flag for WKUPx pin before enable.This bit is set by hardware
        and cleared only by a NRST Reset or by setting the WKUPCx bit.- 0: No wakeup
        event occurred- 1: A wakeup event was received from WKUPx pin'
fieldset/PWR_WKUPCR2:
  description: ''
  fields:
    - name: WKUPC
      bit_offset: 0
      bit_size: 1
      description: 'Clear Wakeup Flag for WKUPx pin.These bits are always read as 0.-
        0: No effect- 1: Writing 1 will clear the WKUPFx Wakeup Flag. (Bit is cleared
        to 0 by HW)'
    - name: WKUPP
      bit_offset: 8
      bit_size: 1
      description: 'Wakeup Polarity bit for WKUPx pinThese bits define the polarity
        used for event detection on external wake-up WKUPx pin- 0: Detection on high
        level (rising edge)- 1: Detection on low level (falling edge)'
    - name: WKUPPUPD
      bit_offset: 12
      bit_size: 2
      description: 'Wakeup pull configuration for WKUPx pin.These bits define the IO
        pad pull configuration used when WKUPENCPU1 or/and WKUPENCPU2 = 1. (note that
        the associated GPIO port pull configuration shall be set to the same value or
        00). The Wakeup Pin pull configuration will be maintained in Standby mode.-
        00: No pulls- 01: Pull-up- 10: Pull-down- 11: Reserved'
    - name: WKUPENCPU1
      bit_offset: 16
      bit_size: 1
      description: 'Enable Wakeup WKUPx pin and interrupt for CPU1.- 0: An event on
        WKUPx pin does not wakeup the system from Standby and Stop modes, nor generate
        an interrupt to CPU1.- 1: A rising or falling edge on WKUPx pin wakes-up the
        system from Standby and Stop modes and generate an interrupt to CPU1.'
    - name: WKUPENCPU2
      bit_offset: 17
      bit_size: 1
      description: 'Enable Wakeup WKUPx pin and interrupt for CPU2.- 0: An event on
