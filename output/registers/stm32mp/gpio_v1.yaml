fieldset/GPIO_SECCFGR:
  description: ''
  fields:
  - name: SEC0
    bit_offset: 0
    bit_size: 1
    description: Port x secure I/O pin y (y= 0 to 15)These bits are written by software
      to enabled the secure mode for I/O port pin y.If the system is not secure (TZEN=0)
      write to this bit is ignored.This bit can only be written by secure application.
      If corresponding PRIVy bit is set in GPIOx_PRIVCFGR this bit can only be written
      by secure privileged application.If compartment filtering for this I/O pin is
      enabled by setting CFEN bit in GPIOx_CIDCFGRy, only an allowed compartment can
      write this bit, on top of secure and privileged restriction. Authorized compartment
      value depends on the value of SEM_EN bit in GPIOx_CIDCFGRy and optionally the
      SEM_MUTEX bit in GPIOx_SEMCRy. See the bits descriptions for details.
