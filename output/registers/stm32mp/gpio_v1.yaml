fieldset/GPIO_MODER:
  description: ''
  fields:
  - name: MODE0
    bit_offset: 0
    bit_size: 2
    description: '[1:0]: Port x configuration I/O pin y (y=0 to 15)These bits are
      written by software to configure the I/O mode.Successful read or write to this
      bit must be secure if SECy bit is set in GPIOx_SECCFGR, and must be privileged
      if PRIVy bit is set in GPIOx_PRIVCFGR.Only authorized CPU can read or write
      this bit, as described in Section1.4: IO pin allocation to compartments. Illegal
      read returns zero. Illegal write is ignored.'
