fieldset/GPIO_DELAYRL:
  description: ''
  fields:
  - name: DLY0
    bit_offset: 0
    bit_size: 4
    description: '[3:0]: Port x IO pin y delay setup (y = 0 to 7)Successful read or
      write to this bit must be secure if SECy bit is set in GPIOx_SECCFGR, and must
      be privileged if PRIVy bit is set in GPIOx_PRIVCFGR.Only authorized CPU can
      read or write this bit, as described in Section1.4: IO pin allocation to compartments.
