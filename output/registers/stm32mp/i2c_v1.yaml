fieldset/I2C_CR1:
  description: ''
  fields:
  - name: PE
    bit_offset: 0
    bit_size: 1
    description: Peripheral enable
  - name: TXIE
    bit_offset: 1
    bit_size: 1
    description: TX interrupt enable
  - name: RXIE
    bit_offset: 2
    bit_size: 1
    description: RX interrupt enable
  - name: ADDRIE
    bit_offset: 3
    bit_size: 1
    description: Address match interrupt enable
  - name: NACKIE
    bit_offset: 4
    bit_size: 1
    description: NACK received interrupt enable
  - name: STOPIE
    bit_offset: 5
    bit_size: 1
    description: STOP detection interrupt enable
  - name: TCIE
    bit_offset: 6
    bit_size: 1
    description: Transfer complete interrupt enable
  - name: ERRIE
    bit_offset: 7
    bit_size: 1
    description: Errors interrupt enable
  - name: DNF
    bit_offset: 8
    bit_size: 4
    description: Digital noise filter
  - name: ANFOFF
    bit_offset: 12
    bit_size: 1
    description: Analog noise filter OFF
  - name: SWRST
    bit_offset: 13
    bit_size: 1
    description: Software reset
  - name: TXDMAEN
    bit_offset: 14
    bit_size: 1
    description: DMA transmission requests enable
  - name: RXDMAEN
    bit_offset: 15
    bit_size: 1
    description: DMA reception requests enable
  - name: SBC
    bit_offset: 16
    bit_size: 1
    description: Slave byte control
  - name: NOSTRETCH
    bit_offset: 17
    bit_size: 1
    description: Clock stretching disable
  - name: WUPEN
    bit_offset: 18
    bit_size: 1
    description: Wakeup from STOP enable
  - name: GCEN
    bit_offset: 19
    bit_size: 1
    description: General call enable
  - name: SMBHEN
    bit_offset: 20
    bit_size: 1
    description: SMBus host address enable
  - name: SMBDEN
    bit_offset: 21
    bit_size: 1
    description: SMBus device default address enable
  - name: ALERTEN
    bit_offset: 22
    bit_size: 1
    description: SMBus alert enable
  - name: PECEN
    bit_offset: 23
    bit_size: 1
    description: PEC enable
  - name: FMP
    bit_offset: 24
    bit_size: 1
    description: Fast-mode Plus 20mA drive enable
  - name: ADDRACLR
    bit_offset: 30
    bit_size: 1
    description: Address match flag (ADDR) automatic clear
  - name: STOPFACLR
    bit_offset: 31
    bit_size: 1
    description: STOP detection flag (STOPF) automatic clear
