    description: Channel A status information
  - name: SOB
    bit_offset: 24
    bit_size: 1
    description: Start Of Block
fieldset/SPDIFRX_DIR:
  description: ''
  fields:
  - name: THI
    bit_offset: 0
    bit_size: 13
