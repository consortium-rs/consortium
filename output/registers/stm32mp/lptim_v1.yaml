block/LPTIM:
  description: ''
  items:
    - name: ISR
      byte_offset: 0
      description: LPTIM interrupt and status register
      fieldset: LPTIM_ISR
    - name: ICR
      byte_offset: 4
      description: LPTIM interrupt clear register
      fieldset: LPTIM_ICR
    - name: DIER
      byte_offset: 8
      description: LPTIM interrupt enable register
      fieldset: LPTIM_DIER
    - name: CFGR
      byte_offset: 12
      description: LPTIM configuration register
      fieldset: LPTIM_CFGR
    - name: CR
      byte_offset: 16
      description: LPTIM control register
      fieldset: LPTIM_CR
    - name: CCR1
      byte_offset: 20
      description: LPTIM compare register 1
      fieldset: LPTIM_CCR1
    - name: ARR
      byte_offset: 24
      description: LPTIM autoreload register
      fieldset: LPTIM_ARR
    - name: CNT
      byte_offset: 28
      description: LPTIM counter register
      fieldset: LPTIM_CNT
    - name: OR
      byte_offset: 32
      description: LPTIM1 option register
    - name: CFGR2
      byte_offset: 36
      description: LPTIM configuration register 2
      fieldset: LPTIM_CFGR2
    - name: RCR
      byte_offset: 40
      description: LPTIM repetition register
      fieldset: LPTIM_RCR
    - name: CCMR1
      byte_offset: 44
      description: LPTIM capture/compare mode register 1
      fieldset: LPTIM_CCMR1
    - name: CCR2
      byte_offset: 52
      description: LPTIM compare register 2
      fieldset: LPTIM_CCR2
    - name: HWCFGR2
      byte_offset: 1004
      description: LPTIM peripheral hardware configuration register 2
      fieldset: LPTIM_HWCFGR2
    - name: HWCFGR1
      byte_offset: 1008
      description: LPTIM peripheral hardware configuration register 1
      fieldset: LPTIM_HWCFGR1
    - name: VERR
      byte_offset: 1012
      description: LPTIM peripheral version identification register
      fieldset: LPTIM_VERR
    - name: PIDR
      byte_offset: 1016
      description: LPTIM peripheral type identification register
    - name: SIDR
      byte_offset: 1020
      description: LPTIM registers map size identification register
fieldset/LPTIM_ISR:
  description: ''
  fields:
    - name: CC1IF
      bit_offset: 0
      bit_size: 1
      description: Capture/Compare 1 interrupt flag
    - name: ARRM
      bit_offset: 1
      bit_size: 1
      description: Autoreload match
    - name: EXTTRIG
      bit_offset: 2
      bit_size: 1
      description: External trigger edge event
    - name: CMP1OK
      bit_offset: 3
      bit_size: 1
      description: Compare register 1 update OK
    - name: ARROK
      bit_offset: 4
      bit_size: 1
      description: Autoreload register update OK
    - name: UP
      bit_offset: 5
      bit_size: 1
      description: Counter direction change down to up
    - name: DOWN
      bit_offset: 6
      bit_size: 1
      description: Counter direction change up to down
    - name: UE
      bit_offset: 7
      bit_size: 1
      description: LPTIM update event occurred
    - name: REPOK
      bit_offset: 8
      bit_size: 1
      description: Repetition register update OK
    - name: CC2IF
      bit_offset: 9
      bit_size: 1
      description: Capture/Compare 2 interrupt flag
    - name: CC1OF
      bit_offset: 12
      bit_size: 1
      description: Capture 1 over-capture flag
    - name: CC2OF
      bit_offset: 13
      bit_size: 1
      description: Capture 2 over-capture flag
    - name: CMP2OK
      bit_offset: 19
      bit_size: 1
      description: Compare register 2 update OK
    - name: DIEROK
      bit_offset: 24
      bit_size: 1
      description: Interrupt enable register update OK
fieldset/LPTIM_ICR:
  description: ''
  fields:
    - name: CC1CF
      bit_offset: 0
      bit_size: 1
      description: Capture/compare 1 clear flag
    - name: ARRMCF
      bit_offset: 1
      bit_size: 1
      description: Autoreload match clear flag
    - name: EXTTRIGCF
      bit_offset: 2
      bit_size: 1
      description: External trigger valid edge clear flag
    - name: CMP1OKCF
      bit_offset: 3
      bit_size: 1
      description: Compare register 1 update OK clear flag
    - name: ARROKCF
      bit_offset: 4
      bit_size: 1
      description: Autoreload register update OK clear flag
    - name: UPCF
      bit_offset: 5
      bit_size: 1
      description: Direction change to UP clear flag
    - name: DOWNCF
      bit_offset: 6
      bit_size: 1
      description: Direction change to down clear flag
    - name: UECF
      bit_offset: 7
      bit_size: 1
      description: Update event clear flag
    - name: REPOKCF
      bit_offset: 8
      bit_size: 1
      description: Repetition register update OK clear flag
    - name: CC2CF
      bit_offset: 9
      bit_size: 1
      description: Capture/compare 2 clear flag
    - name: CC1OCF
      bit_offset: 12
      bit_size: 1
      description: Capture/compare 1 over-capture clear flag
    - name: CC2OCF
      bit_offset: 13
      bit_size: 1
      description: Capture/compare 2 over-capture clear flag
    - name: CMP2OKCF
      bit_offset: 19
      bit_size: 1
      description: Compare register 2 update OK clear flag
    - name: DIEROKCF
      bit_offset: 24
      bit_size: 1
      description: Interrupt enable register update OK clear flag
