[package]
description       = "Consortium microcontroller cpu runtime library"
edition.workspace = true
license.workspace = true
name              = "consortium-runtime-mcu"
version.workspace = true

[features]
dbg        = ["dep:consortium-dbg"]
default    = ["ipc-shm"]
imx93      = ["consortium-ipc-transport-memory?/imx93", "imx9x"]
imx95      = ["consortium-ipc-transport-memory?/imx95", "imx9x"]
imx9x      = []
ipc        = ["ipc-shm"]
ipc-shm    = ["dep:consortium-ipc", "dep:consortium-ipc-transport-memory"]
stm32mp21x = ["consortium-ipc-transport-memory?/stm32mp21x"]
stm32mp23x = ["consortium-ipc-transport-memory?/stm32mp23x"]
stm32mp25x = ["consortium-ipc-transport-memory?/stm32mp25x"]
# Compatibility alias for the previous STM32MP2 default. New code should use
# the chip-family features above so STM32MP21 can select IPCC without HSEM.
stm32mp2xx = ["stm32mp25x"]

[dependencies]
consortium-ipc = { default-features = false, optional = true, path = "../consortium-ipc" }
consortium-dbg = { default-features = false, features = [
  "logger",
], optional = true, path = "../consortium-dbg" }
consortium-ipc-transport-memory = { default-features = false, optional = true, path = "../consortium-ipc-transport-memory" }
cortex-m = { version = "0.7" }
num-traits = { default-features = false, version = "0.2.19" }
static_cell = { default-features = false, version = "2" }
