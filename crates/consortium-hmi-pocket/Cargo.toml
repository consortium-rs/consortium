[package]
description          = "Native PocketJS adapter for Consortium HMI"
edition.workspace    = true
license.workspace    = true
name                 = "consortium-hmi-pocket"
version.workspace    = true
authors.workspace    = true
categories.workspace = true
homepage.workspace   = true
keywords.workspace   = true
readme               = "README.md"
repository.workspace = true
# The PocketJS crates require Rust 1.93, above the workspace MSRV.
rust-version = "1.93"

[features]
default = []
# Windowed winit shell: opens a native window (Wayland/X11 on Linux, Cocoa on
# macOS), drives `PocketApp` per frame, and presents the CPU-rasterized UI
# through softbuffer.
shell = ["dep:softbuffer", "dep:winit"]

# The PocketJS crates are pinned to the release `submodules/pocketjs` is checked
# out at (`v0.16.0`), so the Rust crates and the bun-built `<app>.js`/`.pak`
# share one binding generation; bump both together.
[dependencies]
consortium-hmi        = { path = "../consortium-hmi", version = "0.5.0" }
consortium-hmi-input  = { path = "../consortium-hmi-input", version = "0.5.0" }
pocket-guest-rquickjs = "0.16.0"
pocket-raster         = "0.16.0"
pocket-runtime        = "0.16.0"
pocketjs-core         = "0.16.0"
rquickjs              = "0.12"
softbuffer            = { optional = true, version = "0.4" }
thiserror             = "2.0.18"
tokio                 = { features = ["rt", "sync"], version = "1" }
winit                 = { optional = true, version = "0.30" }

[dev-dependencies]
tokio = { features = ["rt-multi-thread"], version = "1" }

[[example]]
name              = "kiosk"
required-features = ["shell"]

[lints]
workspace = true
