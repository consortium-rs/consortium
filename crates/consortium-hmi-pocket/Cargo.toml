[package]
description       = "Native PocketJS adapter for Consortium HMI"
edition.workspace = true
license.workspace = true
name              = "consortium-hmi-pocket"
version.workspace = true

[dependencies]
anyhow         = "1"
consortium-hmi = { path = "../consortium-hmi", version = "^0.1" }
pocket-mod     = { path = "../../submodules/pocketjs/pocket3d/crates/pocket-mod" }
pocket-ui-wgpu = { path = "../../submodules/pocketjs/pocket3d/crates/pocket-ui-wgpu" }
pocket3d       = { default-features = false, path = "../../submodules/pocketjs/pocket3d/crates/pocket3d" }
tokio          = { features = ["rt", "sync"], version = "1" }

[dev-dependencies]
tokio = { features = ["rt-multi-thread"], version = "1" }

[lints]
workspace = true
