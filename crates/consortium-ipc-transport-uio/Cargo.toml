[package]
name = "consortium-ipc-transport-uio"
description = "UIO-based IPC transport for Consortium"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
consortium-ipc = { path = "../consortium-ipc", features = ["std", "futures"] }
uio = "0.5.2"
tokio = { version = "1", features = ["rt", "sync", "net"] }
thiserror = "2"
pin-project = "1.1.11"
