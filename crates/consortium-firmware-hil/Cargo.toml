[package]
name = "consortium-firmware-hil"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "consortium-firmware-hil"
test = false

[dependencies]
consortium-runtime-mcu = { path = "../consortium-runtime-mcu", features = ["stm32mp2xx"] }
consortium-ipc-transport-mem = { path = "../consortium-ipc-transport-mem" }
consortium-ipc = { path = "../consortium-ipc" }
consortium-codec-postcard = { path = "../consortium-codec-postcard" }
embassy-executor = { version = "0.5", features = ["arch-cortex-m", "executor-thread"] }
cortex-m = "0.7"
cortex-m-rt = "0.7"
postcard = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
