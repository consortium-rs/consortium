[package]
description            = "Platform management provider traits (clock, pin control, power, reset) for Consortium"
edition.workspace      = true
license.workspace      = true
name                   = "consortium-pmi"
version.workspace      = true
authors.workspace      = true
categories.workspace   = true
homepage.workspace     = true
keywords.workspace     = true
readme                 = "README.md"
repository.workspace   = true
rust-version.workspace = true

[dependencies]
consortium-core = { path = "../consortium-core", version = "0.5.0" }
defmt           = { optional = true, version = "1" }

[features]
# Derive `defmt::Format` on the identifier and configuration types.
defmt = ["consortium-core/defmt", "dep:defmt"]
# Provider futures must be `Send` (`MaybeSend` requires it).
std = ["consortium-core/std"]

[lints]
workspace = true
