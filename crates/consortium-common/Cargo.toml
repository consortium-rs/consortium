[package]
name = "consortium-common"
description = "Common utilities and types for Consortium"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
std = ["serde?/std", "rkyv?/std", "rkyv?/bytecheck"]
alloc = ["rkyv?/alloc", "rkyv?/bytecheck"]
serde = ["dep:serde", "dep:serde_yaml"]
postcard = ["dep:postcard", "dep:serde"]
prost = ["dep:prost"]
rkyv = ["dep:rkyv"]
default = []

[dependencies]
serde = { version = "1.0.228", features = ["derive"], default-features = false, optional = true }
serde_yaml = { version = "0.9", optional = true }
thiserror = { version = "2.0", default-features = false }
postcard = { version = "1.1.3", optional = true }
prost = { version = "0.14.3", default-features = false, optional = true }
rkyv = { version = "0.8.15", default-features = false, features = ["bytecheck"], optional = true }

[dev-dependencies]
tempfile = "3.8"
