[package]
name = "consortium-tee-proc-macros"
description = "Proc-macros for Consortium TEE: tee_service!, #[tee_command], and #[derive(TeeParam)] with pluggable codec support"
version.workspace = true
edition.workspace = true

[lib]
proc-macro = true


[dependencies]
heck = "0.5.0"
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = { version = "2.0.117", features = ["full"] }
