[package]
name = "consortium-tee-proc-macros"
version.workspace = true
edition.workspace = true

[lib]
proc-macro = true

[features]
## Enable serialized-type support (`T: TeeParam`, `&mut T: TeeParam`) in `#[tee_command]`
## via `postcard`. Requires the consuming crate to depend on `postcard` with `features =
## ["alloc"]`. Automatically enabled by `consortium-tee`'s `serde` feature.
serde = []

[dependencies]
heck = "0.5.0"
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = { version = "2.0.117", features = ["full"] }
