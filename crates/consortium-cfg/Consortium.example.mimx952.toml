# i.MX 952 example: a CM7 debug ring, two MU channels to Linux over the
# WAKEUP-domain MU7/MU8, and CM7-owned peripherals.
[profile]
chip        = "mimx9529avzxn"
shared      = "./shared"
deploy_root = "/opt/consortium"

[endpoints]
linux = "./app"
cm7   = "./firmware"

# The SM-managed i.MX 952 grants no OCRAM to the M7 (imx-sm `mx952evk.cfg`), so
# every shared window lives in the DDR range NXP's System Manager configs give
# both the M7 and Linux, above the EVK's vring/vdev and resource-table carveouts.
[dbg.cm7]
memory = { base = 0x88300000, length = 0x2000 }
mtu    = 64

[[ipc.channel]]
name          = "lp"
doorbell      = "mu8"
pattern       = "memory"
primary       = "linux"
secondary     = "cm7"
party.linux   = { ack_chan = 0, chan = 4, type = "LowPowerData" }
party.cm7     = { ack_chan = 1, chan = 5, type = "PowerControl" }
config.memory = { base = 0x88304000, length = 0x4000 }
config.ack    = true
mtu           = 128

[[ipc.channel]]
name          = "sensor"
doorbell      = "mu7"
pattern       = "memory"
primary       = "linux"
secondary     = "cm7"
party.linux   = { chan = 6, type = "SensorData" }
party.cm7     = { chan = 7, type = "MotionControl" }
config.memory = { base = 0x88308000, length = 0x4000 }
config.cache  = true
mtu           = 128

[peripheral.lpuart3]
owner  = "cm7"
secure = false
pin.tx = "GPIO_IO14"
pin.rx = "GPIO_IO15"

[peripheral.lpi2c3]
owner     = "cm7"
secure    = false
clock     = 24000000
frequency = 400000
pin.sda   = "GPIO_IO28"
pin.scl   = "GPIO_IO29"

[peripheral.can2]
owner  = "cm7"
secure = false
pin.tx = "GPIO_IO25"
pin.rx = "GPIO_IO27"

[peripheral.gpio2]
owner  = "cm7"
secure = false
