[profile]
chip        = "mimx9596xvt"
shared      = "./shared"
deploy_root = "/opt/consortium"

[endpoints]
linux = "./app"
optee = "./ta"
cm33  = "./firmware"

# The SM-managed i.MX 95 grants no OCRAM to the M7, so every shared window
# lives in the DDR range NXP's System Manager configs give both the M7 and Linux.
[dbg.cm7]
memory = { base = 0x88300000, length = 0x2000 }
mtu    = 64

[[ipc.channel]]
name          = "lp"
doorbell      = "mu8"
pattern       = "memory"
primary       = "linux"
secondary     = "cm7"
party.linux   = { ack_chan = 0, chan = 4, type = "LowPowerData" }
party.cm7     = { ack_chan = 1, chan = 5, type = "PowerControl" }
config.memory = { base = 0x88304000, length = 0x4000 }
config.ack    = true
mtu           = 128

[[ipc.channel]]
name          = "sensor"
doorbell      = "mu7"
pattern       = "memory"
primary       = "linux"
secondary     = "cm7"
party.linux   = { chan = 6, type = "SensorData" }
party.cm7     = { chan = 7, type = "MotionControl" }
config.memory = { base = 0x88308000, length = 0x4000 }
config.cache  = true
mtu           = 128
codec         = "rkyv"

[tee]
uuid = "48551DD5-74B2-4D24-BF9D-A09F02F5C56F"

[hmi]
engine  = "cog"
backend = "wayland"
debug   = "http://127.0.0.1:5173/"
source  = "website"
build   = "website/dist"

[peripheral.lpi2c2]
owner   = "ap"
secure  = false
pin.sda = "I2C2_SDA"
pin.scl = "I2C2_SCL"

[peripheral.lpspi2]
owner    = "cm33"
secure   = false
pin.sin  = "UART1_RXD"
pin.sout = "UART2_RXD"
pin.sck  = "UART2_TXD"

[peripheral.lpi2c1]
owner     = "cm7"
secure    = false
clock     = 24000000
frequency = 100000

[peripheral.gpio2]
owner  = "cm7"
secure = false
