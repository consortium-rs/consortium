# Fixture: a full env-contributing manifest (mirrors the i.MX95 example) with
# [ipc], [dbg], and [tee] all present. Confirms the sections compose into one
# sorted env block. The surrounding [platform] section is ignored by the
# env export.

[platform]
chip = "mimx9596cvt"

[ipc]
base   = 0x204C0000 # 541851648
length = 0x1000     # 4096
uio    = 0
mtu    = 64

[dbg]
base   = 0x204C1000 # 541855744
length = 0x800      # 2048
uio    = 1
mtu    = 64

[tee]
uuid = "12345678-1234-1234-1234-123456789012"
