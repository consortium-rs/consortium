[package]
description            = "Configuration subsystem support for the Consortium project."
edition.workspace      = true
license.workspace      = true
name                   = "consortium-cfg"
version.workspace      = true
authors.workspace      = true
categories.workspace   = true
homepage.workspace     = true
keywords.workspace     = true
readme                 = "README.md"
repository.workspace   = true
rust-version.workspace = true

[dependencies]
consortium-cfg-common           = { path = "../consortium-cfg-common", version = "0.3.0" }
consortium-data                 = { path = "../consortium-data", version = "0.3.0" }
consortium-dts                  = { path = "../consortium-dts", version = "0.3.0" }
consortium-log                  = { features = ["tracing"], path = "../consortium-log", version = "0.3.0" }
consortium-ipc-transport-memory = { path = "../consortium-ipc-transport-memory", version = "0.3.0" }
prettyplease                    = "0.3"
proc-macro2                     = "1.0.106"
quote                           = "1.0.46"
serde                           = { features = ["derive"], version = "1.0.228" }
syn                             = "3.0"
thiserror                       = "2.0.18"
toml                            = "1.1.0"

[dev-dependencies]
# `trybuild` compiles the generated per-core init code (written to `tests/ui/`)
# against the real runtime crates, so every crate the codegen names must be a
# (dev-)dependency here for the UI crates to resolve it.
consortium-codec = { features = ["alloc", "postcard", "rkyv"], path = "../consortium-codec" }
# Generated bring-up names the chip HALs' peripheral singletons (`Peri<'static,
# peripherals::LPI2C1>`), so the UI crates need both HALs even though each
# generated file only uses one. Only the modules the codegen names are enabled:
# the HALs' default `defmt` would switch `consortium-log` to its `defmt` backend
# for every crate in this dev-dependency graph, and `consortium-codec` has no
# `defmt` to link against.
consortium-hal-imx9 = { default-features = false, features = [
  "gpio",
  "i2c",
  "mimx95",
  "time-driver-lpit",
], path = "../consortium-hal-imx9" }
consortium-hal-stm32mp2 = { default-features = false, features = [
  "gpio",
  "i2c",
  "stm32mp25x",
  "time-driver-gp-tim",
], path = "../consortium-hal-stm32mp2" }
consortium-ipc = { path = "../consortium-ipc" }
consortium-ipc-doorbell-hsem = { features = ["std"], path = "../consortium-ipc-doorbell-hsem" }
consortium-ipc-doorbell-ipcc = { features = ["std"], path = "../consortium-ipc-doorbell-ipcc" }
consortium-ipc-doorbell-mu = { features = ["std"], path = "../consortium-ipc-doorbell-mu" }
consortium-shared-memory = { path = "../consortium-shared-memory" }
insta = "1"
rkyv = { default-features = false, features = ["alloc", "bytecheck"], version = "0.8.16" }
serde = { features = ["derive"], version = "1.0.228" }
trybuild = "1"

# The AP/Linux-side generated code targets `consortium-runtime-app`, which is
# gated to `target_os = "linux"`; the UI test only emits + compiles those files
# on Linux, so the dependency is Linux-only too. Keep default features disabled
# here: cfg UI tests need UIO + debug-console symbols, but CI does not provide an
# OP-TEE client export for the runtime app's `tee` default feature.
[target.'cfg(target_os = "linux")'.dev-dependencies]
consortium-runtime-app = { default-features = false, features = [
  "dbg",
  "ipc-shm",
], path = "../consortium-runtime-app" }

[lints]
workspace = true
