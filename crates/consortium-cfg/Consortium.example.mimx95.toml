[profile]
chip        = "mimx9596xvt"
shared      = "./shared"
deploy_root = "/opt/consortium"
# Where endpoint crates put `target/`: "nested" (default, one per crate) or
# "unified" (one Cargo workspace rooted beside this file, which must hold its
# root Cargo.toml).
# workspace = "nested"

[endpoints]
linux = "./app"
optee = "./ta"
cm33  = "./firmware"

[dbg.cm33]
memory = { base = 0x000408000, length = 0x2000 }
mtu    = 64

[[ipc.channel]]
name          = "lp"
doorbell      = "mu1"
pattern       = "memory"
primary       = "linux"
secondary     = "cm33"
party.linux   = { chan = 4, type = "LowPowerData" }
party.cm33    = { chan = 5, type = "PowerControl" }
config.memory = { base = 0x000400000, length = 0x4000 }
mtu           = 128

[[ipc.channel]]
name          = "sensor"
doorbell      = "mu7"
pattern       = "memory"
primary       = "linux"
secondary     = "cm7"
party.linux   = { chan = 6, type = "SensorData" }
party.cm7     = { chan = 7, type = "MotionControl" }
config.memory = { base = 0x000404000, length = 0x4000 }
mtu           = 128
codec         = "rkyv"

[tee]
uuid = "48551DD5-74B2-4D24-BF9D-A09F02F5C56F"

[hmi]
engine  = "cog"
backend = "wayland"
debug   = "http://127.0.0.1:5173/"
source  = "website"
build   = "website/dist"

[peripheral.i2c1]
owner   = "ap"
secure  = false
pin.sda = "PB0"
pin.scl = "PB1"

[peripheral.spi1]
owner    = "cm33"
secure   = false
pin.miso = "PA6"
pin.mosi = "PA7"
pin.sck  = "PA5"
