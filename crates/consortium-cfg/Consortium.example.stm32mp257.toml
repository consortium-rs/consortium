[profile]
chip = "stm32mp257fak3"

[endpoints]
linux = "./app"
optee = "./ta"
cm33  = "./firmware"

[memory.ipc]
base   = 0x000400000
length = 0x8000
mtu    = 128

[memory.dbg]
base   = 0x000408000
length = 0x2000
mtu    = 64

[[ipc.channel]]
doorbell   = "hsem"
linux.chan = 0
linux.type = "SensorData"
cm33.chan  = 1
cm33.type  = "MotionControl"

[[ipc.channel]]
doorbell  = "ipcc1"
cm0p.chan = 0
cm0p.type = "PowerMode"

[tee]
uuid = "48551DD5-74B2-4D24-BF9D-A09F02F5C56F"

[hmi]
engine  = "cog"
backend = "wayland"
debug   = "http://127.0.0.1:5173/"
build   = "website/dist"

[peripheral.i2c1]
owner   = "ap"
secure  = false
pin.sda = "PB0"
pin.scl = "PB1"

[peripheral.spi1]
owner    = "cm33"
secure   = false
pin.miso = "PA6"
pin.mosi = "PA7"
pin.sck  = "PA5"
