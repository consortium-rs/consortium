[profile]
chip        = "stm32mp257fak3"
shared      = "./shared"
deploy_root = "/opt/consortium"

[endpoints]
linux = "./app"
optee = "./ta"
cm33  = "./firmware"

[dbg]
# How the host (AP) consumes the rings: "auto" spawns a console that forwards
# decoded defmt frames to `tracing`; "interface" hands back reader handles.
mode = "auto"

# defmt ring for the CM33, in SRAM2 (base 0x00060000 in the stm32mp25 chip
# database), just below the sensor IPC region.
[dbg.cm33]
memory = { base = 0x00062000, length = 0x2000 }
mtu    = 64

# The sensor channel lives in SRAM2, visible to both the CA35 (via UIO) and the
# CM33 (via the raw physical base).
[[ipc.channel]]
name          = "sensor"
doorbell      = "hsem"
pattern       = "memory"
primary       = "linux"
secondary     = "cm33"
party.linux   = { chan = 0, type = "SensorData" }
party.cm33    = { chan = 1, type = "MotionControl" }
config.memory = { base = 0x00064000, length = 0x4000 }
mtu           = 128

# The low-power channel lives in LPSRAM3 (base 0x000C4000), the only SRAM window
# the CM0+ can reach.
[[ipc.channel]]
name          = "lp"
doorbell      = "ipcc2"
pattern       = "memory"
primary       = "linux"
secondary     = "cm0p"
party.linux   = { chan = 0, type = "PowerStatus" }
party.cm0p    = { chan = 1, type = "PowerMode" }
config.memory = { base = 0x000C4000, length = 0x4000 }
mtu           = 128
codec         = "rkyv"

[tee]
uuid = "48551DD5-74B2-4D24-BF9D-A09F02F5C56F"

[hmi]
engine  = "cog"
backend = "wayland"
debug   = "http://127.0.0.1:5173/"
source  = "website"
build   = "website/dist"

[peripheral.i2c1]
owner   = "ap"
secure  = false
pin.sda = "PB0"
pin.scl = "PB1"

[peripheral.spi1]
owner    = "cm33"
secure   = false
pin.miso = "PA6"
pin.mosi = "PA7"
pin.sck  = "PA5"
