[package]
description       = "Build system for Consortium applications and runtimes"
edition.workspace = true
license.workspace = true
name              = "consortium-builder"
version.workspace = true

[dependencies]
consortium-cfg-common = { path = "../consortium-cfg-common" }
thiserror         = "2.0.18"
tokio             = { features = ["full"], version = "1.50.0" }
toml              = "1.1.0"
uuid              = "1.23.0"

[dev-dependencies]
# `serde` derive is used by the builder/toml integration tests in
# `compile/utils.rs` to deserialize a `Consortium.toml` `[ipc]` table.
serde = { features = ["derive"], version = "1.0.228" }
