[package]
description            = "Build system for Consortium applications and runtimes"
edition.workspace      = true
license.workspace      = true
name                   = "consortium-builder"
version.workspace      = true
authors.workspace      = true
categories.workspace   = true
homepage.workspace     = true
keywords.workspace     = true
readme                 = "README.md"
repository.workspace   = true
rust-version.workspace = true

[dependencies]
consortium-cfg        = { path = "../consortium-cfg", version = "0.3.0" }
consortium-cfg-common = { path = "../consortium-cfg-common", version = "0.3.0" }
consortium-log        = { features = ["tracing"], path = "../consortium-log", version = "0.3.0" }
object                = "0.36.7"
rust-ini              = "0.21.3"
serde                 = { features = ["derive"], version = "1.0.228" }
syn                   = "3.0"
thiserror             = "2.0.18"
tokio                 = { features = ["full"], version = "1.50.0" }
toml                  = "1.1.0"
uuid                  = "1.23.0"
