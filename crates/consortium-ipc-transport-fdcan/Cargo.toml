[package]
description            = "Segmenting FDCAN IPC transport for Consortium"
edition.workspace      = true
license.workspace      = true
name                   = "consortium-ipc-transport-fdcan"
version.workspace      = true
authors.workspace      = true
categories.workspace   = true
homepage.workspace     = true
keywords.workspace     = true
readme                 = "README.md"
repository.workspace   = true
rust-version.workspace = true

[features]
alloc   = ["consortium-ipc/alloc"]
default = ["std"]
# Route this crate's protocol tracing to `defmt` for firmware-side builds; the
# `std` path routes the same call sites to `tracing` instead.
defmt = ["consortium-ipc/defmt", "consortium-log/defmt", "dep:defmt"]
# Unlike the UART transport, `std` does not select a second impl family here:
# the `CanTx`/`CanRx` seam is defined by this crate, so its futures can be
# declared `MaybeSend` once and satisfy both worlds. `std` only widens
# `MaybeSend` to `Send` and routes logging to `tracing`.
std = ["alloc", "consortium-ipc/std", "consortium-log/tracing"]

[dependencies]
consortium-ipc = { default-features = false, path = "../consortium-ipc", version = "0.5.0" }
consortium-log = { default-features = false, path = "../consortium-log", version = "0.5.0" }
defmt          = { optional = true, version = "1.1.0" }
embedded-can   = { version = "0.4.1" }
thiserror      = { default-features = false, version = "2.0" }

[dev-dependencies]
consortium-codec = { features = ["alloc", "postcard"], path = "../consortium-codec" }
futures          = "0.3"
serde            = { default-features = false, features = ["derive"], version = "1.0.228" }

[lints]
workspace = true
