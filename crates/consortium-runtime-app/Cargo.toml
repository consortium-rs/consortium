[package]
description            = "Consortium application (nonsecure) runtime library on Linux side"
edition.workspace      = true
license.workspace      = true
name                   = "consortium-runtime-app"
version.workspace      = true
authors.workspace      = true
categories.workspace   = true
homepage.workspace     = true
keywords.workspace     = true
readme                 = "README.md"
repository.workspace   = true
rust-version.workspace = true

[lib]
# Doc examples here are all `ignore`d, and running doctests would force a
# normal-mode lib build that trips the runtime env guards in `lib.rs`
# outside of `consortium-builder`. Disable them so `cargo test` exercises the
# host unit tests without requiring an injected `[ipc]` layout.
doctest = false

[features]
dbg     = ["dep:consortium-dbg"]
default = ["dbg", "ipc-shm", "macros"]
ffi     = ["consortium-ffi"]
hmi     = ["consortium-hmi"]
mimx93  = ["consortium-ipc-transport-memory?/mimx93", "mimx9x"]
mimx95  = ["consortium-ipc-transport-memory?/mimx95", "mimx9x"]
mimx9x  = []
ipc     = ["dep:consortium-ipc"]
ipc-shm = ["dep:consortium-ipc-transport-memory", "ipc"]
# Re-export the `#[consortium_runtime_app::main]` entry macro.
macros     = ["dep:consortium-runtime-macros"]
ort        = ["consortium-ort"]
stm32mp21x = ["consortium-ipc-transport-memory?/stm32mp21x"]
stm32mp23x = ["consortium-ipc-transport-memory?/stm32mp23x"]
stm32mp25x = ["consortium-ipc-transport-memory?/stm32mp25x"]
# Compatibility alias for the previous STM32MP2 default. New code should use
# the chip-family features above so STM32MP21 can select IPCC without HSEM.
stm32mp2xx = ["stm32mp25x"]
tee        = ["consortium-tee"]

# Portable pieces of the runtime. The UIO IRQ dispatch loop (`irq` module) is
# `cfg(unix)` so its socketpair-backed tests run on macOS as well as Linux, so
# its deps must be available on every Unix — not just under the Linux table
# below. `net` gates Tokio's `AsyncFd` and the IO-driver `enable_io()`.
[target.'cfg(unix)'.dependencies]
consortium-log = { features = ["tracing"], path = "../consortium-log", version = "0.4.0" }
libc           = "0.2"
tokio          = { features = ["io-util", "net", "rt", "sync", "time"], version = "1" }

[target.'cfg(target_os = "linux")'.dependencies]
consortium-dbg = { default-features = false, features = [
  "decode",
], optional = true, path = "../consortium-dbg", version = "0.4.0" }
consortium-ffi = { optional = true, path = "../consortium-ffi", version = "0.4.0" }
consortium-hmi = { optional = true, path = "../consortium-hmi", version = "0.4.0" }
consortium-ipc = { features = [
  "std",
], optional = true, path = "../consortium-ipc", version = "0.4.0" }
consortium-ipc-transport-memory = { features = [
  "std",
], optional = true, path = "../consortium-ipc-transport-memory", version = "0.4.0" }
consortium-ort = { optional = true, path = "../consortium-ort", version = "0.4.0" }
consortium-runtime-macros = { optional = true, path = "../consortium-runtime-macros", version = "0.4.0" }
consortium-tee = { optional = true, path = "../consortium-tee", version = "0.4.0" }
thiserror = { version = "2.0" }
tracing = { version = "0.1" }
tracing-subscriber = { features = ["env-filter"], version = "0.3" }
uio = { version = "0.6.0" }


[dependencies]
