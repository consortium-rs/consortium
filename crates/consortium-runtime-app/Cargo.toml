[package]
description       = "Consortium application (nonsecure) runtime library on Linux side"
edition.workspace = true
license.workspace = true
name              = "consortium-runtime-app"
version.workspace = true

[lib]
# Doc examples here are all `ignore`d, and running doctests would force a
# normal-mode lib build that trips the `assert_configured()` guard in `lib.rs`
# outside of `consortium-builder`. Disable them so `cargo test` exercises the
# host unit tests without requiring an injected `[ipc]` layout.
doctest = false

[features]
stm32mp21x = ["consortium-ipc-doorbell-ipcc/stm32mp21x"]
stm32mp23x = ["consortium-ipc-doorbell-hsem", "consortium-ipc-doorbell-ipcc/stm32mp23x"]
stm32mp25x = ["consortium-ipc-doorbell-hsem", "consortium-ipc-doorbell-ipcc/stm32mp25x"]
# Compatibility alias for the previous STM32MP2 default. New code should use
# the chip-family features above so STM32MP21 can select IPCC without HSEM.
default    = ["imx9x", "stm32mp25x", "tee"]
ffi        = ["consortium-ffi"]
hmi        = ["consortium-hmi"]
imx9x      = ["consortium-ipc-doorbell-mu"]
ort        = ["consortium-ort"]
stm32mp2xx = ["stm32mp25x"]
tee        = ["consortium-tee"]

[target.'cfg(target_os = "linux")'.dependencies]
consortium-common = { path = "../consortium-common" }
consortium-ffi = { optional = true, path = "../consortium-ffi" }
consortium-hmi = { optional = true, path = "../consortium-hmi" }
consortium-ipc = { features = ["std"], path = "../consortium-ipc" }
consortium-ipc-doorbell-hsem = { features = [
  "std",
], optional = true, path = "../consortium-ipc-doorbell-hsem" }
consortium-ipc-doorbell-ipcc = { features = [
  "std",
], optional = true, path = "../consortium-ipc-doorbell-ipcc" }
consortium-ipc-doorbell-mu = { features = [
  "std",
], optional = true, path = "../consortium-ipc-doorbell-mu" }
consortium-ipc-transport-memory = { features = [
  "std",
], path = "../consortium-ipc-transport-memory" }
consortium-ort = { optional = true, path = "../consortium-ort" }
consortium-tee = { optional = true, path = "../consortium-tee" }
libc = "0.2"
thiserror = { version = "2.0" }
tokio = { features = ["io-util", "rt", "time"], version = "1" }
uio = { version = "0.5.2" }


[dependencies]
memmap2 = "0.9.11"
