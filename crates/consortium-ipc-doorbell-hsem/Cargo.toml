[package]
description       = "HSEM (Hardware Semaphore) Doorbell driver for Consortium IPC"
edition.workspace = true
license.workspace = true
name              = "consortium-ipc-doorbell-hsem"
version.workspace = true

[features]
defmt     = ["consortium-ipc/defmt", "dep:defmt"]
std       = ["consortium-ipc/std", "dep:tokio"]
stm32mp23 = []
stm32mp25 = []
stm32h7x5 = []
stm32h7x7 = []
default   = ["stm32mp25"]
tracing   = ["consortium-log/tracing"]

[dependencies]
atomic-waker   = "1.1.2"
bitfield       = "0.13.2"
consortium-ipc = { default-features = false, path = "../consortium-ipc" }
defmt          = { optional = true, version = "1" }
thiserror      = { default-features = false, version = "2.0" }
tokio          = { features = ["rt", "sync"], optional = true, version = "1" }
consortium-log = { path = "../consortium-log" }
