[package]
name = "consortium-ipc-doorbell-hsem"
description = "HSEM (Hardware Semaphore) Doorbell driver for Consortium IPC"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
std = ["dep:tokio", "consortium-ipc/std"]

[dependencies]
consortium-ipc = { path = "../consortium-ipc", default-features = false }
atomic-waker = "1.1.2"
tokio = { version = "1", features = ["sync"], optional = true }
