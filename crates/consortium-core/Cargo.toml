[package]
description            = "Shared-memory regions, descriptors, and doorbells for Consortium"
edition.workspace      = true
license.workspace      = true
name                   = "consortium-core"
version.workspace      = true
authors.workspace      = true
categories.workspace   = true
homepage.workspace     = true
keywords.workspace     = true
readme                 = "README.md"
repository.workspace   = true
rust-version.workspace = true

[dependencies]
atomic-waker            = { optional = true, version = "1.1.2" }
bitfield                = { optional = true, version = "0.20" }
consortium-hal-imx9     = { default-features = false, optional = true, path = "../consortium-hal-imx9", version = "0.6.0" }
consortium-hal-stm32mp2 = { default-features = false, optional = true, path = "../consortium-hal-stm32mp2", version = "0.6.0" }
consortium-log          = { default-features = false, path = "../consortium-log", version = "0.6.0" }
critical-section        = { optional = true, version = "1.2.0" }
defmt                   = { optional = true, version = "1" }
embedded-hal            = { optional = true, workspace = true }
thiserror               = { default-features = false, version = "2.0" }

[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dependencies]
cortex-m = "0.7"

# ARMv6-M (the STM32MP25 CM0+) has no compare-and-swap, so route `atomic-waker`
# through `portable-atomic` there. The fallback is the binary's choice:
# `consortium-runtime-mcu` enables portable-atomic's `critical-section` feature.
[target.'cfg(not(target_has_atomic = "ptr"))'.dependencies]
atomic-waker = { features = ["portable-atomic"], optional = true, version = "1.1.2" }

[dev-dependencies]
critical-section = { features = ["std"], version = "1.2.0" }

[features]
# Derive `defmt::Format` on the descriptor, bell, and GPIO error types, and require
# it of every `Doorbell::Error`. `defmt`'s macros expand to literal `defmt::` paths,
# so the crate depends on `defmt` directly as well as through the log facade.
defmt = ["consortium-log/defmt", "dep:defmt"]
# The generic Type-A bell protocol (`bell`). Implied by every chip feature; off by
# default so a plain `consortium-ipc` build needs no atomic CAS (riscv32imc has none).
bell = ["dep:atomic-waker", "dep:bitfield", "dep:critical-section"]
# Single-channel GPIO doorbell (`gpio`), generic over any `embedded-hal` output pin.
gpio = ["dep:atomic-waker", "dep:embedded-hal"]
# `MaybeSend` requires `Send`; bells take the `std` interrupt path and log to `tracing`.
std = ["consortium-log/tracing"]
# i.MX 9 chip selection: forwarded to the chip HAL, whose MU singletons, clock gates,
# and PAC the `bell::mu` register model binds to. Mutually exclusive.
mimx93  = ["bell", "consortium-hal-imx9/mimx93", "dep:consortium-hal-imx9"]
mimx95  = ["bell", "consortium-hal-imx9/mimx95", "dep:consortium-hal-imx9"]
mimx952 = ["bell", "consortium-hal-imx9/mimx952", "dep:consortium-hal-imx9"]
# STM32MP2 chip selection: forwarded to the chip HAL, whose IPCC/HSEM singletons and
# PAC the `bell::ipcc` and `bell::hsem` register models bind to (HSEM is absent on MP21).
stm32mp21x = ["bell", "consortium-hal-stm32mp2/stm32mp21x", "dep:consortium-hal-stm32mp2"]
stm32mp23x = ["bell", "consortium-hal-stm32mp2/stm32mp23x", "dep:consortium-hal-stm32mp2"]
stm32mp25x = ["bell", "consortium-hal-stm32mp2/stm32mp25x", "dep:consortium-hal-stm32mp2"]

[lints]
workspace = true
