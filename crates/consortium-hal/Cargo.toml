[package]
description            = "Shared HAL traits for Consortium chip support crates"
edition.workspace      = true
license.workspace      = true
name                   = "consortium-hal"
version.workspace      = true
authors.workspace      = true
categories.workspace   = true
homepage.workspace     = true
keywords.workspace     = true
readme.workspace       = true
repository.workspace   = true
rust-version.workspace = true

[features]
default = []

[dependencies]
# `peripherals!` expands to `Peri`/`PeripheralType` and a `critical_section`
# guard, and re-exports both so chip HALs need not name Embassy directly.
cortex-m             = { version = "0.7" }
critical-section     = { version = "1.2.0" }
embassy-hal-internal = { version = "0.5.0" }

[lints]
workspace = true
