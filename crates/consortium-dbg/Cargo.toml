[package]
edition.workspace      = true
license.workspace      = true
name                   = "consortium-dbg"
version.workspace      = true
authors.workspace      = true
categories.workspace   = true
homepage.workspace     = true
keywords.workspace     = true
readme                 = "README.md"
repository.workspace   = true
rust-version.workspace = true
description            = "defmt-over-shared-memory logging and panic handling for Consortium"

[features]
arch-cortex-m = ["consortium-log/defmt", "dep:cortex-m"]
arch-riscv    = ["dep:riscv"]
decode        = ["dep:defmt-decoder", "dep:defmt-parser", "host"]
default       = ["host", "logger"]
host          = ["consortium-log/tracing"]
logger        = []
panic-handler = ["logger"]

[dependencies]
bitflags                 = "2.11.1"
consortium-shared-memory = { path = "../consortium-shared-memory", version = "0.4.0" }
const-str                = { default-features = false, version = "1.1.0" }
cortex-m                 = { optional = true, version = "0.7" }
defmt                    = "1.1.0"
defmt-decoder            = { optional = true, version = "1.1" }
defmt-parser             = { optional = true, version = "1" }
riscv                    = { optional = true, version = "0.16.1" }
thiserror                = { default-features = false, version = "2.0" }
consortium-log           = { path = "../consortium-log", version = "0.4.0" }

[dev-dependencies]
hex = "0.4"

[lints]
workspace = true
