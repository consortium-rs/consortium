[package]
edition.workspace = true
license.workspace = true
name              = "consortium-dbg"
version.workspace = true

[features]
arch-cortex-m = ["consortium-log/defmt", "dep:cortex-m"]
arch-riscv    = ["dep:riscv"]
decode        = ["dep:defmt-decoder", "dep:defmt-parser", "host"]
default       = ["host", "logger"]
doorbell-hsem = ["consortium-ipc-doorbell-hsem"]
doorbell-mu   = ["consortium-ipc-doorbell-mu"]
host          = ["consortium-log/tracing"]
logger        = []
panic-handler = ["logger"]

[dependencies]
bitflags                     = "2.11.1"
consortium-ipc               = { default-features = false, path = "../consortium-ipc" }
consortium-ipc-doorbell-hsem = { default-features = false, optional = true, path = "../consortium-ipc-doorbell-hsem" }
consortium-ipc-doorbell-mu   = { default-features = false, optional = true, path = "../consortium-ipc-doorbell-mu" }
consortium-shared-memory     = { path = "../consortium-shared-memory" }
const-str                    = { default-features = false, version = "1.1.0" }
cortex-m                     = { optional = true, version = "0.7" }
defmt                        = "1.1.0"
defmt-decoder                = { optional = true, version = "1.1" }
defmt-parser                 = { optional = true, version = "1" }
riscv                        = { optional = true, version = "0.16.1" }
thiserror                    = { default-features = false, version = "2.0" }
consortium-log               = { path = "../consortium-log" }

[dev-dependencies]
hex = "0.4"

[lints]
workspace = true
