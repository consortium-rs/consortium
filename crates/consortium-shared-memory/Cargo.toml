[package]
description            = "Shared-memory descriptor primitives for Consortium"
edition.workspace      = true
license.workspace      = true
name                   = "consortium-shared-memory"
version.workspace      = true
authors.workspace      = true
categories.workspace   = true
homepage.workspace     = true
keywords.workspace     = true
readme                 = "README.md"
repository.workspace   = true
rust-version.workspace = true

[dependencies]
defmt     = { optional = true, version = "1" }
thiserror = { default-features = false, version = "2.0" }

[features]
# Derive `defmt::Format` on the descriptor error/magic types for firmware-side
# builds that surface them through `defmt` logging.
defmt = ["dep:defmt"]

[lints]
workspace = true
