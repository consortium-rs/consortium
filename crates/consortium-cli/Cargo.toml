[package]
description       = "Command-line interface for managing Consortium applications and runtimes"
edition.workspace = true
license.workspace = true
name              = "consortium-cli"
version.workspace = true

[dependencies]
clap               = { features = ["derive"], version = "4.5" }
consortium-builder = { path = "../consortium-builder" }
serde              = { features = ["derive"], version = "1.0.228" }
tokio              = { features = ["macros", "rt-multi-thread"], version = "1.50.0" }
