[package]
description       = "Command-line interface for managing Consortium applications and runtimes"
edition.workspace = true
license.workspace = true
# Published as `csti`, matching the binary: `consortium-cli` is taken on
# crates.io by an unrelated project. The directory keeps its descriptive name.
name                   = "csti"
version.workspace      = true
authors.workspace      = true
categories.workspace   = true
homepage.workspace     = true
keywords.workspace     = true
readme                 = "README.md"
repository.workspace   = true
rust-version.workspace = true

[[bin]]
name = "csti"
path = "src/main.rs"

[package.metadata.binstall]
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }{ archive-suffix }"

[package.metadata.binstall.overrides.'cfg(windows)']
pkg-fmt = "zip"

[dependencies]
clap               = { features = ["derive"], version = "4.5" }
consortium-builder = { path = "../consortium-builder", version = "0.4.0" }
tokio              = { features = ["macros", "rt-multi-thread"], version = "1.50.0" }
