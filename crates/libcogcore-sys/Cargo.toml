[package]
name = "libcogcore-sys"
version = "0.1.0"
edition = "2024"
description = "FFI bindings to libcogcore (Cog WPE browser engine)"
license = "Apache 2.0"
links = "cogcore"
include = ["src/**/*", "build.rs", "vendor/include/**/*", "Cargo.toml"]

[build-dependencies]
bindgen = "0.72"
pkg-config = "0.3.33"

[dependencies]
libc = "0.2"
