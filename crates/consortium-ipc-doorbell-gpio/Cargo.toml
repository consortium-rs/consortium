[package]
description            = "GPIO doorbell for Consortium IPC"
edition.workspace      = true
license.workspace      = true
name                   = "consortium-ipc-doorbell-gpio"
version.workspace      = true
authors.workspace      = true
categories.workspace   = true
homepage.workspace     = true
keywords.workspace     = true
readme.workspace       = true
repository.workspace   = true
rust-version.workspace = true

[features]
default = ["std"]
std     = ["consortium-ipc/std", "dep:linux-embedded-hal", "dep:tokio"]

[dependencies]
atomic-waker   = "1.1.2"
consortium-ipc = { default-features = false, path = "../consortium-ipc", version = "0.1.0" }
embedded-hal   = { workspace = true }
tokio          = { features = ["sync"], optional = true, version = "1" }

[target.'cfg(target_os = "linux")'.dependencies]
linux-embedded-hal = { optional = true, version = "0.4" }
