[package]
description            = "GPIO doorbell for Consortium IPC"
edition.workspace      = true
license.workspace      = true
name                   = "consortium-ipc-doorbell-gpio"
version.workspace      = true
authors.workspace      = true
categories.workspace   = true
homepage.workspace     = true
keywords.workspace     = true
readme                 = "README.md"
repository.workspace   = true
rust-version.workspace = true

[features]
default = ["std"]
defmt   = ["consortium-ipc/defmt", "dep:defmt"]
std     = ["consortium-ipc/std", "dep:linux-embedded-hal"]

[dependencies]
atomic-waker   = "1.1.2"
consortium-ipc = { default-features = false, path = "../consortium-ipc", version = "0.5.0" }
defmt          = { optional = true, version = "1" }
embedded-hal   = { workspace = true }

# ARMv6-M (the STM32MP25 CM0+) has no compare-and-swap, so route `atomic-waker`
# through `portable-atomic` there. The fallback is the binary's choice:
# `consortium-runtime-mcu` enables portable-atomic's `critical-section` feature.
[target.'cfg(not(target_has_atomic = "ptr"))'.dependencies]
atomic-waker = { features = ["portable-atomic"], version = "1.1.2" }

[target.'cfg(target_os = "linux")'.dependencies]
linux-embedded-hal = { optional = true, version = "0.5" }
