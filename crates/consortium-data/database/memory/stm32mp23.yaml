name: STM32MP23
trm: https://www.st.com/resource/en/reference_manual/rm0457-stm32mp2325xx-advanced-armbased-3264bit-mpus-stmicroelectronics.pdf
ap: ca35
interrupt_parent: intc
cp:
  - name: cm33
    count: 1
    variant: remote
remoteproc:
  cm33:
    compatible: st,stm32mp2-m33
    vector_section: .isr_vectors
    vector_placement: separate
    vector:
      name: NS_VECTOR_TBL
      read: true
      write: true
      execute: true
      window:
        origin: 0x80100000
        length: 0x00001000
        reserve: true
    flash:
      origin: 0x80101000
      length: 0x007ff000
      reserve: true
    shmem:
      name: SHMEM
      read: true
      write: true
      execute: true
      window:
        origin: 0x812f8000
        length: 0x00008000
        reserve: true
    ram:
      origin: 0x80a00000
      length: 0x00100000
      reserve: true
memory:
  trm_page: [229]
  aliases:
    - offset: 0x20000000
      secure: false
    - offset: 0x30000000
      secure: true
  regions:
    - name: SRAM1
      type: sram
      base: 0x00040000
      length: 0x00020000
      visible: [ap, cm33]
    - name: SRAM2
      type: sram
      base: 0x00060000
      length: 0x00020000
      visible: [ap, cm33]
peripheral:
  aliases:
    - address: 0x50000000
      secure: true
    - address: 0x40000000
      secure: false
  doorbells:
    - name: HSEM
      page: 1306
      type: hsem
      clock:
        provider: scmi_clk
        id: CK_SCMI_HSEM
      length: 0x00000400
      parties:
        - core: linux
          irq: 199
          page_memory: 241
          page_irq: 1753
          memory: 0x06240000
        - core: optee
          irq: 200
          page_memory: 232
          page_irq: 1753
          memory: 0x06240000
        - core: cm33
          irq: 199
          page_memory: 241
          page_irq: 1471
          memory: 0x06240000
        - core: cm33-s
          irq: 200
          page_memory: 232
          page_irq: 1741
          memory: 0x06240000
      party_page: 1306
      channels: 16
      channel_page: 1306
    - name: IPCC1
      page: 1341
      type: ipcc
      clock:
        provider: scmi_clk
        id: CK_SCMI_IPCC1
      length: 0x00000400
      parties:
        - core: linux
          irq: 171
          page_memory: 245
          page_irq: 1752
          memory: 0x00490000
        - core: optee
          irq: 173
          page_memory: 236
          page_irq: 1752
          memory: 0x00490000
        - core: cm33
          irq: 171
          page_memory: 245
          page_irq: 1741
          memory: 0x00490000
        - core: cm33-s
          irq: 173
          page_memory: 236
          page_irq: 1741
          memory: 0x00490000
      party_page: 1342
      channels: 32
      channel_page: 1341
