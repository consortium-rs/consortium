name: MIMX95
trm: https://www.nxp.com/docs/en/reference-manual/IMX95RM.pdf
ap: ca55
interrupt_parent: gic
cp:
  - name: cm33
    variant: manager
  - name: cm7
    variant: remote
remoteproc:
  cm7:
    compatible: fsl,imx95-cm7
    vector_section: .interrupts
    vector_placement: flash
    vector:
      name: m_interrupts
      read: true
      write: false
      execute: true
      window:
        origin: 0x80000000
        length: 0x00001000
        reserve: true
    flash:
      origin: 0x80001000
      length: 0x007ff000
      reserve: true
    shmem:
      name: m_rsc_tbl_in_dram
      read: true
      write: true
      execute: false
      # The 19x19 EVK device tree reserves exactly 0x1000 here
      # (`rsc-table@88220000`); a longer window would partially overlap it.
      window:
        origin: 0x88220000
        length: 0x00001000
        reserve: true
    ram:
      origin: 0x80800000
      length: 0x00800000
      reserve: true
memory:
  trm_page: [65, 77, 88]
  aliases:
    - offset: 0x20000000
      secure: false
    - offset: 0x30000000
      secure: true
  # Access to memory is granted per logical machine by the System Manager, not
  # by the bus. `visible` follows NXP's EVK configurations (imx-sm
  # `configs/mx95evk.cfg` and `configs/other/mx95evkrpmsg.cfg`), which agree on
  # both windows below.
  regions:
    # OCRAM is 0x00480000..0x004D8000, but the first 256 KiB belong to the
    # secure A55 (TF-A) and the M7 has no OCRAM grant at all. Only the top
    # 96 KiB are open to non-secure Linux.
    - name: OCRAM
      type: sram
      base: 0x004C0000
      length: 0x00018000
      visible: [ap]
    # The DDR window both the M7 and non-secure Linux are granted. NXP's EVK
    # device trees reserve 0x88000000..0x88120000 (vrings and the vdev buffer)
    # and 0x88220000 (the resource table) inside it; channels go above those.
    - name: DDR
      type: dram
      base: 0x88000000
      length: 0x02000000
      visible: [ap, cm7]
peripheral:
  aliases:
    - address: 0x50000000
      secure: true
    - address: 0x40000000
      secure: false
  doorbells:
    - name: MU1
      page: 2740
      type: mu
      length: 0x00020000
      window_length: 0x00010000
      parties:
        - core: linux
          window: a
          irq: 224
          page_memory: 99
          page_irq: 127
          memory: 0x04220000
        - core: optee
          window: a
          irq: 224
          page_memory: 99
          page_irq: 127
          memory: 0x04220000
        - core: cm33
          window: b
          irq: 225
          page_memory: 99
          page_irq: 128
          memory: 0x04230000
        - core: cm33-s
          window: b
          irq: 225
          page_memory: 99
          page_irq: 128
          memory: 0x04230000
      party_page: 2740
      channels: 8
      channel_page: 2741
    - name: MU2
