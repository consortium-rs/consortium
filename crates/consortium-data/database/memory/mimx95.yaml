    vector_placement: flash
    vector:
      name: m_interrupts
      read: true
      write: false
      execute: true
      window:
        origin: 0x80000000
        length: 0x00001000
        reserve: true
    flash:
      origin: 0x80001000
      length: 0x007ff000
      reserve: true
