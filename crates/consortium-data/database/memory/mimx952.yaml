name: MIMX952
# Page numbers below cite the IMX952RM, Rev. 2 (October 2026).
trm: IMX952RM, Rev. 2 (October 2026)
ap: ca55
interrupt_parent: gic
# As on i.MX 95: the CM33 runs the System Manager (imx-sm `devices/MIMX952`) and
# the CM7 is the remoteproc-loaded controller core.
cp:
  - name: cm33
    variant: manager
  - name: cm7
    variant: remote
remoteproc:
  cm7:
    # Mainline `imx952-evk.dts` drives the CM7 with the i.MX 95 binding and
    # carveouts: `fsl,imx95-cm7`, `m7_reserved` at 0x80000000 (16 MiB), and the
    # resource table at 0x88220000. MCUX's `MIMX9529_cm7_ddr_ram.ld` places
    # `m_interrupts`/`m_text` at the same DDR addresses as i.MX 95's, so the
    # layout below is i.MX 95's.
    compatible: fsl,imx95-cm7
    vector_section: .interrupts
    vector_placement: flash
    vector:
      name: m_interrupts
      read: true
      write: false
      execute: true
      window:
        origin: 0x80000000
        length: 0x00001000
        reserve: true
    flash:
      origin: 0x80001000
      length: 0x007ff000
      reserve: true
    shmem:
      name: m_rsc_tbl_in_dram
      read: true
      write: true
      execute: false
      # Mainline `imx952-evk.dts` reserves exactly 0x1000 here
      # (`rsc-table@88220000`); a longer window would partially overlap it.
      window:
        origin: 0x88220000
        length: 0x00001000
        reserve: true
    ram:
      origin: 0x80800000
      length: 0x00800000
      reserve: true
memory:
  trm_page: [63, 72, 82]
  aliases:
    - offset: 0x20000000
      secure: false
    - offset: 0x30000000
      secure: true
  # Access to memory is granted per logical machine by the System Manager, not
  # by the bus. `visible` follows NXP's EVK configurations (imx-sm
  # `configs/mx952evk.cfg` and `configs/other/mx952evkrpmsg.cfg`), which agree
  # on both windows below and grant exactly what i.MX 95's do.
  regions:
    # OCRAM is 0x00480000..0x004D8000, but the first 256 KiB belong to the
    # secure A55 (TF-A) and the M7 has no OCRAM grant at all. Only the top
    # 96 KiB are open to non-secure Linux.
    - name: OCRAM
      type: sram
      base: 0x004C0000
      length: 0x00018000
      visible: [ap]
    # The DDR window both the M7 and non-secure Linux are granted. NXP's i.MX 95
    # EVK device trees (and mainline `imx952-evk.dts`, which reuses their
    # carveouts) reserve 0x88000000..0x88120000 (vrings and the vdev buffer)
    # and 0x88220000 (the resource table) inside it; channels go above those.
    - name: DDR
      type: dram
      base: 0x88000000
      length: 0x02000000
      visible: [ap, cm7]
peripheral:
  aliases:
    - address: 0x50000000
      secure: true
    - address: 0x40000000
      secure: false
  doorbells:
