fieldset/SAES_CR:
  description: ''
  fields:
    - name: EN
      bit_offset: 0
      bit_size: 1
      description: SAES Enable
    - name: DATATYPE
      bit_offset: 1
      bit_size: 2
      description: Data type selection
    - name: MODE
      bit_offset: 3
      bit_size: 2
      description: SAES Mode Of Operation
    - name: CHMOD
      bit_offset:
        - start: 5
          end: 6
        - start: 16
          end: 16
      bit_size: 3
      description: SAES Chaining Mode
    - name: DMAINEN
      bit_offset: 11
      bit_size: 1
      description: Enable data input phase DMA management
    - name: DMAOUTEN
      bit_offset: 12
      bit_size: 1
      description: Enable data output phase DMA management
    - name: GCMPH
      bit_offset: 13
      bit_size: 2
      description: GCM or CCM phase selection
    - name: KEYSIZE
      bit_offset: 18
      bit_size: 1
      description: Key size selection
    - name: KEYPROT
      bit_offset: 19
      bit_size: 1
      description: Key protection
    - name: NPBLB
      bit_offset: 20
      bit_size: 4
      description: Number of padding bytes in last block
    - name: KMOD
      bit_offset: 24
      bit_size: 2
      description: Key mode selection
    - name: KSHAREID
      bit_offset: 26
      bit_size: 2
      description: Key Shared ID
    - name: KEYSEL
      bit_offset: 28
      bit_size: 3
      description: Key Selection
    - name: IPRST
      bit_offset: 31
      bit_size: 1
      description: SAES IP software reset
