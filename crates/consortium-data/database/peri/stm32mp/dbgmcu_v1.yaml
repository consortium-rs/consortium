block/DBGMCU:
  description: ''
  items:
    - name: IDCODE
      byte_offset: 0
      description: MCU device ID code
      fieldset: DBGMCU_IDCODE
    - name: CR
      byte_offset: 4
      description: DBGMCU Configuration Register
      fieldset: DBGMCU_CR
    - name: CRA35
      byte_offset: 8
      description: DBGMCU Configuration Register CPU1
      fieldset: DBGMCU_CRA35
