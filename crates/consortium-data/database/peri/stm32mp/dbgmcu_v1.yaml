    - name: APB3FZ1
      byte_offset: 60
      description: DBGMCU APB3 Peripheral Freeze Register CPU1
    - name: APB3FZ2
      byte_offset: 64
      description: DBGMCU APB3 Peripheral Freeze Register CPU2
    - name: APBSRFZ1
      byte_offset: 68
      description: DBGMCU APBSR Peripheral Freeze Register CPU1
    - name: APBSRFZ2
      byte_offset: 72
      description: DBGMCU APBSR Peripheral Freeze Register CPU2
    - name: APBSRFZ3
      byte_offset: 76
      description: DBGMCU APBSR Peripheral Freeze Register CPU3
fieldset/DBGMCU_IDCODE:
  description: ''
  fields:
    - name: DEV_ID
      bit_offset: 0
      bit_size: 12
      description: Device ID
    - name: DIV_ID
      bit_offset: 12
      bit_size: 4
      description: Division ID
    - name: REV_ID
      bit_offset: 16
      bit_size: 16
      description: Device revision
fieldset/DBGMCU_CR:
  description: ''
  fields:
    - name: DBG_SLEEP
      bit_offset: 0
      bit_size: 1
      description: Allow debug in SLEEP mode
    - name: DBG_STOP
      bit_offset: 1
      bit_size: 1
      description: Allow debug in STOP mode
    - name: DBG_STANDBY
      bit_offset: 2
      bit_size: 1
      description: Allow debug in STANDBY mode
    - name: DBG_SWD_SELN
      bit_offset: 4
      bit_size: 1
      description: Select M0+ debug interface
fieldset/DBGMCU_CRA35:
  description: ''
  fields:
    - name: WDFZCTL
      bit_offset: 0
      bit_size: 1
      description: IWDG1 behavior when secure debug enabled
    - name: DBG_STGEN_STOP
      bit_offset: 1
      bit_size: 1
      description: STGEN suspend in debug
