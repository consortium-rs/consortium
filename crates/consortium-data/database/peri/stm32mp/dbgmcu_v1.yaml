      byte_offset: 20
      description: DBGMCU AHB2 (highest part) Peripheral Freeze Register CPU1
    - name: AHB2LFZ2
      byte_offset: 24
      description: DBGMCU AHB2 (lowest part) Peripheral Freeze Register CPU2
    - name: AHB2HFZ2
      byte_offset: 28
      description: DBGMCU AHB2 (highest part) Peripheral Freeze Register CPU2
    - name: AHBSRFZ1
      byte_offset: 32
      description: DBGMCU AHBSR Peripheral Freeze Register CPU1
    - name: AHBSRFZ2
      byte_offset: 36
      description: DBGMCU AHBSR Peripheral Freeze Register CPU2
    - name: AHBSRFZ3
      byte_offset: 40
      description: DBGMCU AHBSR Peripheral Freeze Register CPU3
    - name: APB1FZ1
      byte_offset: 44
      description: DBGMCU APB1 Peripheral Freeze Register CPU1
    - name: APB1FZ2
      byte_offset: 48
      description: DBGMCU APB1 Peripheral Freeze Register CPU2
    - name: APB2FZ1
      byte_offset: 52
      description: DBGMCU APB2 Peripheral Freeze Register CPU1
    - name: APB2FZ2
