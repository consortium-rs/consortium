      bit_offset: 0
      bit_size: 1
      description: When 1, DLL is enabled
    - name: RX_TAP_SEL
      bit_offset: 1
      bit_size: 6
      description: selection of TAP number for RX clock
    - name: BYP_EN
      bit_offset: 16
      bit_size: 1
      description: When 1, DLL bypass mode is enabled
    - name: BYP_CMD
      bit_offset: 17
      bit_size: 5
      description: value of the delay unit when in DLL bypass mode
    - name: ANTIGLITCH_EN
      bit_offset: 22
      bit_size: 1
      description: When 1, the anti-glitch logic is enabled
