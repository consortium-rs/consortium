block/USBH_EHCI:
  description: ''
  items:
    - name: HCCAPBASE
      byte_offset: 0
      description: Capability Register
      fieldset: USBH_EHCI_HCCAPBASE
    - name: HCSPARAMS
      byte_offset: 4
      description: Structural Parameter Register
      fieldset: USBH_EHCI_HCSPARAMS
    - name: HCCPARAMS
      byte_offset: 8
      description: Capability Parameter Register
      fieldset: USBH_EHCI_HCCPARAMS
    - name: USBCMD
      byte_offset: 16
      description: USB Command Register
      fieldset: USBH_EHCI_USBCMD
    - name: USBSTS
      byte_offset: 20
      description: USB Status Register
      fieldset: USBH_EHCI_USBSTS
    - name: USBINTR
      byte_offset: 24
      description: USB Interrupt Enable Register
      fieldset: USBH_EHCI_USBINTR
    - name: FRINDEX
      byte_offset: 28
      description: USB Frame Index Register
      fieldset: USBH_EHCI_FRINDEX
    - name: CTRLDSSEGMENT
      byte_offset: 32
      description: Control Data Structure Selector Register
      fieldset: USBH_EHCI_CTRLDSSEGMENT
    - name: PERIODICLISTBASE
      byte_offset: 36
      description: Periodic Frame List Base Address Register
      fieldset: USBH_EHCI_PERIODICLISTBASE
    - name: ASYNCLISTADDR
      byte_offset: 40
      description: Asynchronous List Address Register
      fieldset: USBH_EHCI_ASYNCLISTADDR
    - name: CONFIGFLAG
      byte_offset: 80
      description: Configure Flag Register
      fieldset: USBH_EHCI_CONFIGFLAG
    - name: PORTSC
      byte_offset: 84
      array:
        len: 1
        stride: 4
      description: Port Status and Control Register
      fieldset: USBH_EHCI_PORTSC
    - name: INSNREG
      byte_offset: 148
      array:
        len: 7
        stride: 4
      description: Implementation Register
fieldset/USBH_EHCI_HCCAPBASE:
  description: ''
  fields:
    - name: CAPLENGTH
      bit_offset: 0
      bit_size: 7
      description: Capability Register Length
    - name: HCIVERSION
      bit_offset: 16
      bit_size: 16
      description: Host Controller Interface Version
fieldset/USBH_EHCI_HCSPARAMS:
  description: ''
  fields:
    - name: N_PORTS
      bit_offset: 0
      bit_size: 4
      description: Number of Ports
    - name: PPC
      bit_offset: 4
      bit_size: 1
      description: Port Power Control
    - name: PRR
      bit_offset: 7
      bit_size: 1
      description: Port Routing Rules
    - name: N_PCC
      bit_offset: 8
      bit_size: 4
      description: Number of Ports per Companion Controller
    - name: N_CC
      bit_offset: 12
      bit_size: 4
      description: Number of Companion Controller
    - name: P_INDICATOR
      bit_offset: 16
      bit_size: 1
      description: Port Indicators
    - name: DPN
      bit_offset: 20
      bit_size: 4
      description: Debug Port Number
fieldset/USBH_EHCI_HCCPARAMS:
  description: ''
  fields:
    - name: SFAC
      bit_offset: 0
      bit_size: 1
      description: 64-bit Addressing Capability
    - name: PFLF
      bit_offset: 1
      bit_size: 1
      description: Programmable Frame List Flag
    - name: ASPC
      bit_offset: 2
      bit_size: 1
      description: Asynchronous Schedule Park Capability
    - name: ISO
      bit_offset: 4
      bit_size: 4
      description: Isochronous Scheduling Threshold
    - name: EECP
      bit_offset: 8
      bit_size: 8
      description: EHCI Extended Capabilities Pointer
    - name: LPM
      bit_offset: 17
      bit_size: 1
      description: Link Power Management Capability
    - name: PPCE
      bit_offset: 18
      bit_size: 1
      description: Per-Port Change Event Capability
    - name: HCCPARAMS32FPC
      bit_offset: 19
      bit_size: 1
      description: 32-Frame Periodic List Capability
fieldset/USBH_EHCI_USBCMD:
  description: ''
