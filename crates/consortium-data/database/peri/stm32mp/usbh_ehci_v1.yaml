      bit_offset: 7
      bit_size: 1
      description: Light Host Controller Reset (OPTIONAL)
    - name: ASPMC
      bit_offset: 8
      bit_size: 2
      description: Asynchronous Schedule Park Mode Count (OPTIONAL)
    - name: ASPME
      bit_offset: 11
      bit_size: 1
      description: Asynchronous Schedule Park Mode Enable (OPTIONAL)
    - name: ITC
      bit_offset: 16
      bit_size: 8
      description: Interrupt Threshold Control
    - name: HIRD
