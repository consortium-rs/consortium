block/OCTOSPIM:
  description: ''
  items:
    - name: CR
      byte_offset: 0
      description: OCTOSPI IO Manager Control register
      fieldset: OCTOSPIM_CR
    - name: HWCFGR
      byte_offset: 1008
      description: OCTOSPI IO Manager hardware configuration register
      fieldset: OCTOSPIM_HWCFGR
    - name: VERR
      byte_offset: 1012
      description: OCTOSPI IO Manager version register
      fieldset: OCTOSPIM_VERR
    - name: IDR
      byte_offset: 1016
      description: OCTOSPI IO Manager identification
      fieldset: OCTOSPIM_IDR
    - name: SIDR
      byte_offset: 1020
      description: OCTOSPI IO Manager size identification register
      fieldset: OCTOSPIM_SIDR
fieldset/OCTOSPIM_CR:
  description: ''
  fields:
    - name: MUXEN
      bit_offset: 0
      bit_size: 1
      description: Multiplexed mode enable
    - name: MODE
      bit_offset: 1
      bit_size: 1
      description: OCTOSPIM multiplexing mode
    - name: CSSEL_OVR_EN
      bit_offset: 4
      bit_size: 1
      description: Chip select selector override enable
    - name: CSSEL_OVR_O1
      bit_offset: 5
      bit_size: 1
      description: Chip select selector override setting for OCTOSPI1
    - name: CSSEL_OVR_O2
      bit_offset: 6
      bit_size: 1
      description: Chip select selector override setting for OCTOSPI2
    - name: REQ2ACK_TIME
      bit_offset: 16
      bit_size: 8
      description: REQ to ACK time
fieldset/OCTOSPIM_HWCFGR:
  description: ''
  fields:
    - name: NUM_PORT
      bit_offset: 0
      bit_size: 4
      description: Number of ports
fieldset/OCTOSPIM_VERR:
  description: ''
  fields:
    - name: MINVER
      bit_offset: 0
      bit_size: 4
      description: OCTOSPIM minor version
    - name: MAJVER
      bit_offset: 4
      bit_size: 4
      description: OCTOSPIM major version
fieldset/OCTOSPIM_IDR:
  description: ''
  fields:
    - name: ID
      bit_offset: 0
      bit_size: 32
      description: OCTOSPIM identification
fieldset/OCTOSPIM_SIDR:
  description: ''
  fields:
    - name: SID
      bit_offset: 0
      bit_size: 32
      description: Size identifier
