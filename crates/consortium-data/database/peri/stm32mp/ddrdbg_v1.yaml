block/DDRDBG:
  description: ''
  items:
    - name: LP_DISABLE
      byte_offset: 0
      description: DDRDBG low-power disable register
      fieldset: DDRDBG_LP_DISABLE
    - name: BYPASS_PCLKEN
      byte_offset: 4
      description: DDRDBG bypass PCLKEN register
      fieldset: DDRDBG_BYPASS_PCLKEN
    - name: DDRC_AUTO_SR_DELAY
      byte_offset: 8
      description: DDRDBG DDRC auto SR delay register
      fieldset: DDRDBG_DDRC_AUTO_SR_DELAY
    - name: OBSP_CTRL
      byte_offset: 12
      description: DDRDBG OBSP control register
      fieldset: DDRDBG_OBSP_CTRL
    - name: FRAC_PLL_LOCK
      byte_offset: 16
      description: DDRDBG FRAC PLL lock register
      fieldset: DDRDBG_FRAC_PLL_LOCK
    - name: DTO_OUTPUT
      byte_offset: 20
      description: DDRDBG DTO output register
      fieldset: DDRDBG_DTO_OUTPUT
    - name: DFI_ERRORS_CTRL
      byte_offset: 48
      description: DDRDBG DFI error control register
      fieldset: DDRDBG_DFI_ERRORS_CTRL
    - name: DFI_ERROR_STATUS
      byte_offset: 52
      description: DDRDBG DFI error status register
      fieldset: DDRDBG_DFI_ERROR_STATUS
    - name: DFI_ERROR_MSK
      byte_offset: 56
      description: DDRDBG DFI error mask register
      fieldset: DDRDBG_DFI_ERROR_MSK
    - name: DDR34_AC_SWIZZLE_ADD3_0
      byte_offset: 256
      description: DDRDBG DDR34 AC swizzle ADD3_0 register
      fieldset: DDRDBG_DDR34_AC_SWIZZLE_ADD3_0
    - name: DDR34_AC_SWIZZLE_ADD7_4
      byte_offset: 260
      description: DDRDBG DDR34 AC swizzle ADD7_4 register
      fieldset: DDRDBG_DDR34_AC_SWIZZLE_ADD7_4
    - name: DDR34_AC_SWIZZLE_ADD11_8
      byte_offset: 264
      description: DDRDBG DDR34 AC swizzle ADD11_8 register
      fieldset: DDRDBG_DDR34_AC_SWIZZLE_ADD11_8
    - name: DDR34_AC_SWIZZLE_ADD15_12
      byte_offset: 268
      description: DDRDBG DDR34 AC swizzle ADD15_12 register
      fieldset: DDRDBG_DDR34_AC_SWIZZLE_ADD15_12
    - name: DDR34_AC_SWIZZLE_BK2_0_ACTN
      byte_offset: 272
      description: DDRDBG DDR34 AC swizzle BK2 0 ACTN register
      fieldset: DDRDBG_DDR34_AC_SWIZZLE_BK2_0_ACTN
    - name: DDR34_AC_SWIZZLE_RASN_CASN_BG1_0
      byte_offset: 276
      description: DDRDBG DDR34 AC swizzle RASN CASN BG1_0 register
      fieldset: DDRDBG_DDR34_AC_SWIZZLE_RASN_CASN_BG1_0
    - name: DDR34_AC_SWIZZLE_WEN
      byte_offset: 280
      description: DDRDBG DDR34 AC swizzle WEN register
      fieldset: DDRDBG_DDR34_AC_SWIZZLE_WEN
fieldset/DDRDBG_LP_DISABLE:
  description: ''
  fields:
    - name: LPI_XPI_DISABLE
      bit_offset: 0
      bit_size: 1
      description: Disables the possibility to automatically (out of RCC control)
        gate down the DDRC clock when an inactivity period is detected.
    - name: LPI_DDRC_DISABLE
      bit_offset: 8
      bit_size: 1
      description: Disables the possibility to automatically (out of RCC control)
        gate down the XPI port axi_clock when an inactivity period is detected.
fieldset/DDRDBG_BYPASS_PCLKEN:
  description: ''
  fields:
    - name: ENABLE
      bit_offset: 0
      bit_size: 1
      description: The DDRPHYC Bypass_Pclken is active. The targeted data rate is
        less than 666 MT/s. The clock fed to the SDRAM interface is the one coming
        directly from the interfan frac pll, and the DDRPHYC does not alter it.
fieldset/DDRDBG_DDRC_AUTO_SR_DELAY:
  description: ''
  fields:
    - name: DELAY_CYCLES
      bit_offset: 0
      bit_size: 7
      description: Number of delay cycles to wait before to gate down the DDRC clock
        when in auto self-refresh.
fieldset/DDRDBG_OBSP_CTRL:
  description: ''
  fields:
    - name: OBSP0_SEL
      bit_offset: 0
      bit_size: 5
      description: Selects which of the input observable signal is forwarded to the
        HDP on selectable observability line 0.
    - name: OBSP1_SEL
      bit_offset: 8
      bit_size: 5
      description: Selects which of the input observable signal is forwarded to the
        HDP on selectable observability line 1.
    - name: OBSP2_SEL
      bit_offset: 16
      bit_size: 5
      description: Selects which of the input observable signal is forwarded to the
        HDP on selectable observability line 2.
    - name: OBSP3_SEL
      bit_offset: 24
      bit_size: 5
      description: Selects which of the input observable signal is forwarded to the
        HDP on selectable observability line 3.
fieldset/DDRDBG_FRAC_PLL_LOCK:
  description: ''
  fields:
    - name: LOCK
      bit_offset: 0
      bit_size: 1
      description: PLL lock, direct copy of ddrss_pll2_lock.
fieldset/DDRDBG_DTO_OUTPUT:
  description: ''
  fields:
    - name: DTO
      bit_offset: 0
      bit_size: 1
      description: DDRPHYC DTO output is stored in this register. Among other signals
        of interests, the DDRPHYC PLL lock can be observed on this register.
fieldset/DDRDBG_DFI_ERRORS_CTRL:
  description: ''
  fields:
    - name: DFI_ERROR0_CLEAR
      bit_offset: 0
      bit_size: 1
      description: Clears the interrupt linked with dfi_error0.
    - name: DFI_ERROR0_SET
      bit_offset: 1
      bit_size: 1
      description: Triggers the interrupt linked with dfi_error0.
    - name: DFI_ERROR1_CLEAR
      bit_offset: 8
      bit_size: 1
      description: Clears the interrupt linked with dfi_error1.
    - name: DFI_ERROR1_SET
      bit_offset: 9
      bit_size: 1
      description: Triggers the interrupt linked with dfi_error1.
fieldset/DDRDBG_DFI_ERROR_STATUS:
  description: ''
  fields:
    - name: DFI_ERROR0_STATUS
      bit_offset: 0
      bit_size: 1
      description: Gets the status of the interrupt linked with dfi_error0.
    - name: DFI_ERROR1_STATUS
      bit_offset: 8
      bit_size: 1
      description: Gets the status of the interrupt linked with dfi_error1.
fieldset/DDRDBG_DFI_ERROR_MSK:
  description: ''
  fields:
    - name: DFI_ERROR0_MASK
      bit_offset: 0
      bit_size: 1
      description: Interrupt linked to dfi_error0 is masked. Clears the interrupt
        linked with dfi_error0.
    - name: DFI_ERROR1_MASK
      bit_offset: 8
      bit_size: 1
      description: Interrupt linked to dfi_error1 is masked. Clears the interrupt
        linked with dfi_error1.
