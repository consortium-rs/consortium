fieldset/LVDS_CR:
  description: ''
  fields:
    - name: LVDSEN
      bit_offset: 0
      bit_size: 1
      description: LVDS PHY Enable
    - name: HSPOL
      bit_offset: 1
      bit_size: 1
      description: HS Polarity (polarity of the horizontal synchronisation)
    - name: VSPOL
      bit_offset: 2
      bit_size: 1
      description: VS Polarity (polarity of the vertical synchronization)
    - name: DEPOL
      bit_offset: 3
      bit_size: 1
      description: DE Polarity (polarity of the data enable)
    - name: CI
      bit_offset: 4
      bit_size: 1
      description: Control Internal (software controlled bit, that can be inserted
        among output data)
    - name: LKMOD
      bit_offset: 5
      bit_size: 1
      description: Link Mode, for both Links
    - name: LKPHA
      bit_offset: 6
      bit_size: 1
      description: Link Phase, for both Links
    - name: LK1POL
      bit_offset: 16
      bit_size: 5
      description: Link-1 output Polarity, defined per output Data/Clock Lane, from
        Lane-[4:0]
    - name: LK2POL
      bit_offset: 21
      bit_size: 5
      description: Link-2 output Polarity, defined per output Data/Clock Lane, from
        Lane-[4:0]
