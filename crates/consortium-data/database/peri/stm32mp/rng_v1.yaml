block/RNG:
  description: ''
  items:
    - name: CR
      byte_offset: 0
      description: RNG control register
      fieldset: RNG_CR
    - name: SR
      byte_offset: 4
      description: RNG status register
      fieldset: RNG_SR
    - name: DR
      byte_offset: 8
      description: RNG data register
      fieldset: RNG_DR
    - name: NSCR
      byte_offset: 12
      description: RNG noise source control register
      fieldset: RNG_NSCR
    - name: HTCR
      byte_offset: 16
      description: RNG health test control register
      fieldset: RNG_HTCR
    - name: HWCFGR
      byte_offset: 1008
      description: RNG hardware configuration register
      fieldset: RNG_HWCFGR
    - name: VERR
      byte_offset: 1012
      description: RNG version register
      fieldset: RNG_VERR
    - name: IPIDR
      byte_offset: 1016
      description: RNG identification register
      fieldset: RNG_IPIDR
    - name: SIDR
      byte_offset: 1020
      description: RNG size identification register
      fieldset: RNG_SIDR
