block/IAC:
  description: ''
  items:
    - name: IER
      byte_offset: 0
      array:
        len: 6
        stride: 4
      description: IAC Interrupt enable register x, 0x000-0x014
    - name: ISR
      byte_offset: 128
      array:
        len: 6
        stride: 4
      description: IAC Interrupt status register x, 0x080-0x094
    - name: ICR
      byte_offset: 256
      array:
        len: 6
        stride: 4
      description: IAC Interrupt clear register x, 0x100-0x114
    - name: IISR
      byte_offset: 876
      array:
        len: 6
        stride: 4
      description: IAC Ilac input status register x, 0x36C-0x380
    - name: HWCFGR2
      byte_offset: 1004
      description: IAC HW configuration register 2
    - name: HWCFGR1
      byte_offset: 1008
      description: IAC HW configuration register 1
    - name: VERR
      byte_offset: 1012
      description: IAC Version register
      fieldset: IAC_VERR
    - name: IPIDR
      byte_offset: 1016
      description: IAC Identification register
      fieldset: IAC_IPIDR
    - name: SIDR
      byte_offset: 1020
      description: IAC Size ID register
      fieldset: IAC_SIDR
fieldset/IAC_VERR:
  description: ''
  fields:
    - name: MINREV
      bit_offset: 0
      bit_size: 4
      description: '0x0000000F'
    - name: MAJREV
      bit_offset: 4
      bit_size: 4
fieldset/IAC_IPIDR:
  description: ''
  fields:
    - name: ID
      bit_offset: 0
      bit_size: 32
fieldset/IAC_SIDR:
  description: ''
  fields:
    - name: SID
      bit_offset: 0
      bit_size: 32
