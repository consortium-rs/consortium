block/I3C:
  description: ''
  items:
    - name: CR
      byte_offset: 0
      description: I3C message control register
      fieldset: I3C_CR
    - name: CFGR
      byte_offset: 4
      description: I3C configuration register
      fieldset: I3C_CFGR
    - name: RDR
      byte_offset: 16
      description: I3C receive data byte register
      fieldset: I3C_RDR
    - name: RDWR
      byte_offset: 20
      description: I3C receive data word register
      fieldset: I3C_RDWR
    - name: TDR
      byte_offset: 24
      description: I3C transmit data byte register
      fieldset: I3C_TDR
    - name: TDWR
      byte_offset: 28
      description: I3C transmit data word register
      fieldset: I3C_TDWR
    - name: IBIDR
      byte_offset: 32
      description: I3C IBI payload data register
      fieldset: I3C_IBIDR
    - name: TGTTDR
      byte_offset: 36
      description: I3C target transmit configuration register
      fieldset: I3C_TGTTDR
    - name: SR
      byte_offset: 48
      description: I3C status register
      fieldset: I3C_SR
    - name: SER
      byte_offset: 52
      description: I3C status error register
      fieldset: I3C_SER
    - name: RMR
      byte_offset: 64
      description: I3C received message register
      fieldset: I3C_RMR
    - name: EVR
      byte_offset: 80
      description: I3C event register
      fieldset: I3C_EVR
    - name: IER
      byte_offset: 84
      description: I3C interrupt enable register
      fieldset: I3C_IER
    - name: CEVR
      byte_offset: 88
      description: I3C clear event register
      fieldset: I3C_CEVR
    - name: DEVR0
      byte_offset: 96
      description: I3C own device characteristics register
      fieldset: I3C_DEVR0
    - name: DEVRX
      byte_offset: 100
      array:
        len: 4
        stride: 4
      description: I3C device x (0<=x<=4) register
      fieldset: I3C_DEVRX
    - name: MAXRLR
      byte_offset: 144
      description: I3C maximum read length register
      fieldset: I3C_MAXRLR
    - name: MAXWLR
      byte_offset: 148
      description: I3C maximum write length register
      fieldset: I3C_MAXWLR
    - name: TIMINGR0
      byte_offset: 160
      description: I3C timing register 0
      fieldset: I3C_TIMINGR0
    - name: TIMINGR1
      byte_offset: 164
      description: I3C timing register 1
      fieldset: I3C_TIMINGR1
    - name: TIMINGR2
      byte_offset: 168
      description: I3C timing register 2
      fieldset: I3C_TIMINGR2
    - name: BCR
      byte_offset: 192
      description: I3C bus characteristics register
      fieldset: I3C_BCR
    - name: DCR
      byte_offset: 196
      description: I3C device characteristics register
      fieldset: I3C_DCR
    - name: GETCAPR
      byte_offset: 200
      description: I3C get capability register
      fieldset: I3C_GETCAPR
    - name: CRCAPR
      byte_offset: 204
      description: I3C controller-role capability register
      fieldset: I3C_CRCAPR
    - name: GETMXDSR
      byte_offset: 208
      description: I3C get capability register
      fieldset: I3C_GETMXDSR
    - name: EPIDR
      byte_offset: 212
      description: I3C extended provisioned ID register
      fieldset: I3C_EPIDR
    - name: HWCFGR
      byte_offset: 1008
      description: I3C hardware configuration register
      fieldset: I3C_HWCFGR
    - name: VERR
      byte_offset: 1012
      description: I3C version register
      fieldset: I3C_VERR
    - name: IPIDR
      byte_offset: 1016
      description: I3C IP identification register
      fieldset: I3C_IPIDR
    - name: SIDR
      byte_offset: 1020
      description: I3C IP size identification register
      fieldset: I3C_SIDR
fieldset/I3C_CR:
  description: ''
  fields:
    - name: DCNT
      bit_offset: 0
      bit_size: 16
      description: count of data to transfer during a read or write message, in bytes
        (whatever I3C is acting as contr
    - name: RNW
      bit_offset: 16
      bit_size: 1
      description: read / non-write message (when I3C is acting as controller)
    - name: ADD
      bit_offset: 17
      bit_size: 7
      description: 7-bit I3C dynamic / I2C static target address (when I3C is acting
        as controller)
    - name: MTYPE
      bit_offset: 27
      bit_size: 4
      description: message type (whatever I3C is acting as controller/target)
    - name: MEND
      bit_offset: 31
      bit_size: 1
      description: message end type (when the I3C is acting as controller)
fieldset/I3C_CFGR:
  description: ''
  fields:
    - name: EN
      bit_offset: 0
      bit_size: 1
      description: I3C enable (whatever I3C is acting as controller/target)
    - name: CRINIT
      bit_offset: 1
      bit_size: 1
      description: initial controller/target role
    - name: NOARBH
      bit_offset: 2
      bit_size: 1
      description: no arbitrable header after a START (when I3C is acting as a controller)
    - name: RSTPTRN
      bit_offset: 3
      bit_size: 1
      description: HDR reset pattern enable (when I3C is acting as a controller)
    - name: EXITPTRN
      bit_offset: 4
      bit_size: 1
      description: HDR Exit Pattern enable (when I3C is acting as a controller)
    - name: HKSDAEN
      bit_offset: 5
      bit_size: 1
      description: High-keeper enable on SDA line (when I3C is acting as a controller)
    - name: HJACK
      bit_offset: 7
      bit_size: 1
      description: Hot Join request acknowledge (when I3C is acting as a controller)
    - name: RXDMAEN
      bit_offset: 8
      bit_size: 1
      description: RX-FIFO DMA request enable (whatever I3C is acting as controller/target)
    - name: RXFLUSH
      bit_offset: 9
      bit_size: 1
      description: RX-FIFO flush (whatever I3C is acting as controller/target)
    - name: RXTHRES
      bit_offset: 10
      bit_size: 1
      description: RX-FIFO threshold (whatever I3C is acting as controller/target)
    - name: TXDMAEN
      bit_offset: 12
      bit_size: 1
      description: TX-FIFO DMA request enable (whatever I3C is acting as controller/target)
    - name: TXFLUSH
      bit_offset: 13
      bit_size: 1
      description: TX-FIFO flush (whatever I3C is acting as controller/target)
    - name: TXTHRES
      bit_offset: 14
      bit_size: 1
      description: TX-FIFO threshold (whatever I3C is acting as controller/target)
    - name: SDMAEN
      bit_offset: 16
      bit_size: 1
      description: S-FIFO DMA request enable (when I3C is acting as controller)
    - name: SFLUSH
      bit_offset: 17
      bit_size: 1
      description: S-FIFO flush (when I3C is acting as controller)
    - name: SMODE
      bit_offset: 18
      bit_size: 1
      description: S-FIFO enable / status receive mode (when I3C is acting as controller)
    - name: TMODE
      bit_offset: 19
      bit_size: 1
      description: transmit mode (when I3C is acting as controller)
    - name: CDMAEN
      bit_offset: 20
      bit_size: 1
      description: C-FIFO DMA request enable (when I3C is acting as controller)
    - name: CFLUSH
      bit_offset: 21
      bit_size: 1
      description: C-FIFO flush (when I3C is acting as controller)
    - name: TSFSET
      bit_offset: 30
      bit_size: 1
      description: frame transfer set (a
fieldset/I3C_RDR:
  description: ''
  fields:
    - name: RDB0
      bit_offset: 0
      bit_size: 8
      description: 8-bit received data on I3C bus
fieldset/I3C_RDWR:
  description: ''
  fields:
    - name: RDB0
      bit_offset: 0
      bit_size: 8
      description: 8-bit received data (earliest byte on I3C bus)
    - name: RDB1
      bit_offset: 8
      bit_size: 8
      description: 8-bit received data (next byte after RDB0 on I3C bus)
    - name: RDB2
      bit_offset: 16
      bit_size: 8
      description: 8-bit received data (next byte after RDB1 on I3C bus)
    - name: RDB3
      bit_offset: 24
      bit_size: 8
      description: 8-bit received data (latest byte on I3C bus)
fieldset/I3C_TDR:
  description: ''
  fields:
    - name: TDB0
      bit_offset: 0
      bit_size: 8
      description: 8-bit data to transmit on I3C bus
fieldset/I3C_TDWR:
  description: ''
  fields:
    - name: TDB0
      bit_offset: 0
      bit_size: 8
      description: 8-bit transmit data (earliest byte on I3C bus)
    - name: TDB1
      bit_offset: 8
      bit_size: 8
      description: 8-bit transmit data (next byte after TDB0[7:0] on I3C bus)
    - name: TDB2
      bit_offset: 16
      bit_size: 8
      description: 8-bit transmit data (next byte after TDB1[7:0] on I3C bus)
    - name: TDB3
      bit_offset: 24
      bit_size: 8
      description: 8-bit transmit data (latest byte on I3C bus)
fieldset/I3C_IBIDR:
  description: ''
  fields:
    - name: IBIDB0
      bit_offset: 0
      bit_size: 8
      description: 8-bit IBI payload data (earliest byte on I3C bus, i
    - name: IBIDB1
      bit_offset: 8
      bit_size: 8
      description: 8-bit IBI payload data (next byte on I3C bus after IBIDB0[7:0])
    - name: IBIDB2
      bit_offset: 16
      bit_size: 8
      description: 8-bit IBI payload data (next byte on I3C bus after IBIDB1[7:0])
    - name: IBIDB3
      bit_offset: 24
      bit_size: 8
      description: 8-bit IBI payload data (latest byte on I3C bus)
fieldset/I3C_TGTTDR:
  description: ''
  fields:
    - name: TGTTDCNT
      bit_offset: 0
      bit_size: 16
      description: transmit data counter, in bytes (when I3C is configured as target)
    - name: PRELOAD
      bit_offset: 16
      bit_size: 1
      description: preload of the TX-FIFO (when I3C is configured as target)
fieldset/I3C_SR:
  description: ''
  fields:
    - name: XDCNT
      bit_offset: 0
      bit_size: 16
      description: data counter
    - name: ABT
      bit_offset: 17
      bit_size: 1
      description: a private read message is completed/aborted prematurely by the
        target (when the I3C is acting as co
    - name: DIR
      bit_offset: 18
      bit_size: 1
      description: message direction
    - name: MID
      bit_offset: 24
      bit_size: 8
      description: message identifier/counter of a given frame (when the I3C is acting
        as controller)
fieldset/I3C_SER:
  description: ''
  fields:
    - name: CODERR
      bit_offset: 0
      bit_size: 4
      description: protocol error code/type
    - name: PERR
      bit_offset: 4
      bit_size: 1
      description: protocol error
    - name: STALL
      bit_offset: 5
      bit_size: 1
      description: SCL stall error (when the I3C is acting as target)
    - name: DOVR
      bit_offset: 6
      bit_size: 1
      description: RX-FIFO overrun or TX-FIFO underrun
    - name: COVR
      bit_offset: 7
      bit_size: 1
      description: C-FIFO underrun or S-FIFO overrun (when the I3C is acting as controller)
    - name: ANACK
      bit_offset: 8
      bit_size: 1
      description: address not acknowledged (when the I3C is configured as controller)
    - name: DNACK
      bit_offset: 9
      bit_size: 1
      description: data not acknowledged (when the I3C is acting as controller)
    - name: DERR
      bit_offset: 10
      bit_size: 1
      description: data error (when the I3C is acting as controller)
fieldset/I3C_RMR:
  description: ''
  fields:
    - name: IBIRDCNT
      bit_offset: 0
      bit_size: 3
      description: IBI received payload data count (when the I3C is configured as
