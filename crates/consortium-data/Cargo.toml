[package]
description       = "Embedded chip-family databases and generated chip dumps for Consortium."
edition.workspace = true
# Not `license.workspace`: the embedded `database/dts/` tree is vendor device
# tree source redistributed under the permissive half of its dual license —
# BSD-3-Clause for STMicroelectronics STM32MP2, MIT for NXP i.MX 9. See
# `database/dts/README.md`.
license                = "Apache-2.0 AND BSD-3-Clause AND MIT"
name                   = "consortium-data"
version.workspace      = true
authors.workspace      = true
categories.workspace   = true
homepage.workspace     = true
keywords.workspace     = true
readme.workspace       = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
consortium-cfg-common = { path = "../consortium-cfg-common", version = "0.1.0" }
include_dir           = "0.7.4"
serde                 = { features = ["derive"], version = "1.0.228" }
serde_json            = "1.0"
serde_yaml            = "0.9"
thiserror             = "2.0.18"

[lints]
workspace = true
