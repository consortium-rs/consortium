[package]
description       = "STM32 IPCC doorbell driver for Consortium IPC"
edition.workspace = true
license.workspace = true
name              = "consortium-ipc-doorbell-ipcc"
version.workspace = true

[features]
std        = ["consortium-ipc/std", "dep:tokio"]
stm32mp21x = []
stm32mp23x = []
stm32mp25x = []

[dependencies]
atomic-waker   = "1.1.2"
bitfield       = "0.13.2"
consortium-ipc = { default-features = false, path = "../consortium-ipc" }
tokio          = { features = ["rt", "sync"], optional = true, version = "1" }

[lints]
workspace = true
