[package]
edition.workspace = true
license.workspace = true
name              = "consortium-ipc-transport-memory"
version.workspace = true

[features]
alloc = ["consortium-ipc/alloc"]
default = ["std"]
doorbell-hsem = ["dep:consortium-ipc-doorbell-hsem"]
doorbell-ipcc = ["dep:consortium-ipc-doorbell-ipcc"]
doorbell-mu = ["dep:consortium-ipc-doorbell-mu"]
imx93 = ["consortium-ipc-doorbell-mu/imx93", "imx9x"]
imx95 = ["consortium-ipc-doorbell-mu/imx95", "imx9x"]
imx9x = ["doorbell-mu"]
std = [
  "alloc",
  "consortium-ipc-doorbell-hsem?/std",
  "consortium-ipc-doorbell-ipcc?/std",
  "consortium-ipc-doorbell-mu?/std",
  "dep:tokio",
  "dep:uio",
]
stm32mp21x = ["consortium-ipc-doorbell-ipcc/stm32mp21x", "doorbell-ipcc"]
stm32mp23x = [
  "consortium-ipc-doorbell-hsem/stm32mp23",
  "consortium-ipc-doorbell-ipcc/stm32mp23x",
  "doorbell-hsem",
  "doorbell-ipcc",
]
stm32mp25x = [
  "consortium-ipc-doorbell-hsem/stm32mp25",
  "consortium-ipc-doorbell-ipcc/stm32mp25x",
  "doorbell-hsem",
  "doorbell-ipcc",
]
# The MU processor side is now selected at the type level (`Primary`/`Secondary`)
# rather than by a cargo feature; these remain as no-op markers for callers that
# still toggle them.
side-a = []
side-b = []

[dependencies]
consortium-cfg-common        = { path = "../consortium-cfg-common" }
consortium-ipc               = { default-features = false, path = "../consortium-ipc" }
consortium-ipc-doorbell-hsem = { default-features = false, optional = true, path = "../consortium-ipc-doorbell-hsem" }
consortium-ipc-doorbell-ipcc = { default-features = false, optional = true, path = "../consortium-ipc-doorbell-ipcc" }
consortium-ipc-doorbell-mu   = { default-features = false, optional = true, path = "../consortium-ipc-doorbell-mu" }
consortium-shared-memory     = { path = "../consortium-shared-memory" }
crc32fast                    = { default-features = false, version = "1.5.0" }
num_enum                     = { default-features = false, version = "0.7.3" }
pin-project                  = { version = "1.1.11" }
thiserror                    = { default-features = false, version = "2.0" }
tokio                        = { features = ["net", "rt", "sync"], optional = true, version = "1" }
uio                          = { optional = true, version = "0.5.2" }

[dev-dependencies]
atomic-waker = "1.1.2"
consortium-codec = { features = [
  "alloc",
  "postcard",
  "prost",
  "rkyv",
], path = "../consortium-codec" }
embassy-executor = { default-features = false, features = [
  "executor-thread",
  "platform-std",
], version = "0.10.0" }
embassy-futures = "0.1.2"
embassy-sync = { features = ["std"], version = "0.8.0" }
embassy-time = { features = ["std"], version = "0.5.1" }
futures = "0.3"
prost = { default-features = false, version = "0.14.3" }
rkyv = { default-features = false, features = ["bytecheck"], version = "0.8.16" }
serde = { default-features = false, features = ["derive"], version = "1.0.228" }

[lints]
workspace = true
