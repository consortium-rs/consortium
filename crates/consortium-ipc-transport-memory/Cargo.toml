[package]
edition.workspace      = true
license.workspace      = true
name                   = "consortium-ipc-transport-memory"
version.workspace      = true
authors.workspace      = true
categories.workspace   = true
homepage.workspace     = true
keywords.workspace     = true
readme                 = "README.md"
repository.workspace   = true
rust-version.workspace = true
description            = "Shared-memory descriptor/slot transport for Consortium IPC"

[features]
alloc   = ["consortium-ipc/alloc"]
default = ["std"]
# Route this crate's protocol tracing to `defmt` for firmware-side builds; the
# `std` path routes the same call sites to `tracing` instead. `defmt`'s macros
# expand to literal `defmt::` paths, so the crate must depend on `defmt`
# directly as well as through the facade.
defmt = [
  "consortium-ipc-doorbell-hsem?/defmt",
  "consortium-ipc-doorbell-ipcc?/defmt",
  "consortium-ipc-doorbell-mu?/defmt",
  "consortium-ipc/defmt",
  "consortium-log/defmt",
  "consortium-shared-memory/defmt",
  "dep:defmt",
]
doorbell-hsem = ["dep:consortium-ipc-doorbell-hsem"]
doorbell-ipcc = ["dep:consortium-ipc-doorbell-ipcc"]
doorbell-mu = ["dep:consortium-ipc-doorbell-mu"]
mimx93 = ["consortium-ipc-doorbell-mu/mimx93", "mimx9x"]
mimx95 = ["consortium-ipc-doorbell-mu/mimx95", "mimx9x"]
mimx9x = ["doorbell-mu"]
std = [
  "alloc",
  "consortium-ipc-doorbell-hsem?/std",
  "consortium-ipc-doorbell-ipcc?/std",
  "consortium-ipc-doorbell-mu?/std",
  "consortium-log/tracing",
  "dep:tokio",
  "dep:uio",
]
stm32mp21x = ["consortium-ipc-doorbell-ipcc/stm32mp21x", "doorbell-ipcc"]
stm32mp23x = [
  "consortium-ipc-doorbell-hsem/stm32mp23x",
  "consortium-ipc-doorbell-ipcc/stm32mp23x",
  "doorbell-hsem",
  "doorbell-ipcc",
]
stm32mp25x = [
  "consortium-ipc-doorbell-hsem/stm32mp25x",
  "consortium-ipc-doorbell-ipcc/stm32mp25x",
  "doorbell-hsem",
  "doorbell-ipcc",
]

[dependencies]
consortium-codec             = { default-features = false, path = "../consortium-codec", version = "0.2.0" }
consortium-ipc               = { default-features = false, path = "../consortium-ipc", version = "0.2.0" }
consortium-ipc-doorbell-hsem = { default-features = false, optional = true, path = "../consortium-ipc-doorbell-hsem", version = "0.2.0" }
consortium-ipc-doorbell-ipcc = { default-features = false, optional = true, path = "../consortium-ipc-doorbell-ipcc", version = "0.2.0" }
consortium-ipc-doorbell-mu   = { default-features = false, optional = true, path = "../consortium-ipc-doorbell-mu", version = "0.2.0" }
consortium-log               = { default-features = false, path = "../consortium-log", version = "0.2.0" }
consortium-shared-memory     = { path = "../consortium-shared-memory", version = "0.2.0" }
critical-section             = "1.2.0"
crc32fast                    = { default-features = false, version = "1.5.0" }
defmt                        = { optional = true, version = "1.1.0" }
embassy-hal-internal         = "0.5.0"
num_enum                     = { default-features = false, version = "0.7.3" }
pin-project                  = { version = "1.1.11" }
thiserror                    = { default-features = false, version = "2.0" }
tokio                        = { features = ["net", "rt", "sync"], optional = true, version = "1" }
uio                          = { optional = true, version = "0.6.0" }

[dev-dependencies]
atomic-waker = "1.1.2"
consortium-codec = { features = [
  "alloc",
  "postcard",
  "prost",
  "rkyv",
], path = "../consortium-codec" }
embassy-executor = { default-features = false, features = [
  "executor-thread",
  "platform-std",
], version = "0.10.0" }
embassy-futures = "0.1.2"
embassy-sync = { features = ["std"], version = "0.8.0" }
embassy-time = { features = ["std"], version = "0.5.1" }
futures = "0.3"
prost = { default-features = false, version = "0.14.3" }
rkyv = { default-features = false, features = ["bytecheck"], version = "0.8.16" }
serde = { default-features = false, features = ["derive"], version = "1.0.228" }

[lints]
workspace = true
