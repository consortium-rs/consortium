[package]
name = "consortium-ipc-transport-memory"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
alloc = ["consortium-ipc/alloc"]
std = ["alloc", "dep:tokio", "dep:uio"]
default = ["std"]

[dependencies]
num_enum = { version = "0.7.3", default-features = false }
thiserror = { version = "2.0", default-features = false }
consortium-ipc = { path = "../consortium-ipc", default-features = false }
crc32fast = { version = "1.5.0", default-features = false }
tokio = { version = "1", optional = true, features = ["rt", "sync", "net"] }
pin-project = { version = "1.1.11" }
uio = { version = "0.5.2", optional = true }
consortium-common = { path = "../consortium-common", default-features = false }

[lints]
workspace = true
