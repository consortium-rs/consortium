[package]
description            = "Consortium HAL for i.MX 9 family devices"
edition.workspace      = true
license.workspace      = true
name                   = "consortium-hal-imx9"
version.workspace      = true
authors.workspace      = true
categories.workspace   = true
homepage.workspace     = true
keywords.workspace     = true
readme.workspace       = true
repository.workspace   = true
rust-version.workspace = true

[features]
default = [
  "adc",
  "can",
  "dma",
  "gpio",
  "i2c",
  "i3c",
  "mimx95",
  "spi",
  "time-driver-lpit",
  "timer",
  "uart",
]
# Chip selection — forwarded to the PAC. Choose exactly one; enabling several is
# a PAC compile error. Dependents that select a different chip must set
# `default-features = false` so the default `mimx95` is not also pulled in.
mimx93 = ["consortium-pac-imx9/mimx93"]
mimx95 = ["consortium-pac-imx9/mimx95"]
# Forward cortex-m-rt runtime support (vector table, `#[interrupt]`) to the PAC.
rt  = ["consortium-pac-imx9/rt"]
adc = []
# Forwarded to the PAC and to the generated peripheral singletons.
defmt = ["consortium-pac-imx9/defmt"]
dma   = ["dep:embassy-sync"]
gpio  = ["dep:embassy-sync", "dep:embedded-hal"]
can   = ["dep:embassy-sync", "dep:embedded-can", "dep:nb"]
i2c   = ["dep:embassy-sync", "dep:embedded-hal", "dep:embedded-hal-async"]
i3c   = ["dep:embassy-sync"]
# Compatibility alias for the former top-level PWM feature.
pwm              = ["timer"]
spi              = ["dep:embassy-sync", "dep:embedded-hal", "dep:embedded-hal-async"]
timer            = ["dep:embassy-sync", "dep:embedded-hal"]
time-driver-lpit = ["dep:embassy-sync", "dep:embassy-time-driver", "dep:embassy-time-queue-utils"]
uart             = ["dep:embassy-sync", "dep:embedded-hal-nb", "dep:embedded-io", "dep:embedded-io-async"]

[dependencies]
consortium-hal           = { path = "../consortium-hal", version = "0.1.0" }
consortium-pac-imx9      = { default-features = false, path = "../consortium-pac-imx9", version = "0.1.0" }
critical-section         = { version = "1.2.0" }
embassy-hal-internal     = { version = "0.5.0" }
embassy-sync             = { optional = true, version = "0.8.0" }
embassy-time-driver      = { optional = true, version = "0.2.2" }
embassy-time-queue-utils = { optional = true, version = "0.3.2" }
embedded-can             = { optional = true, version = "0.4.1" }
embedded-hal             = { optional = true, version = "1.0.0" }
embedded-hal-async       = { optional = true, version = "1.0.0" }
nb                       = { optional = true, version = "1.1.0" }
embedded-hal-nb          = { optional = true, version = "1.0.0" }
embedded-io              = { optional = true, version = "0.7" }
embedded-io-async        = { optional = true, version = "0.7" }

[dev-dependencies]
# Supplies a host `critical_section` implementation so the buffered-UART IRQ
# path can be exercised in unit tests.
critical-section = { features = ["std"], version = "1.2.0" }

[lints]
workspace = true
