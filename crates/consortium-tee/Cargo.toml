[package]
description            = "Trusted Execution Environment (TEE) support for Consortium with pluggable codec serialization via consortium_codec::CodecFor"
edition.workspace      = true
license.workspace      = true
name                   = "consortium-tee"
version.workspace      = true
authors.workspace      = true
categories.workspace   = true
homepage.workspace     = true
keywords.workspace     = true
readme                 = "README.md"
repository.workspace   = true
rust-version.workspace = true

[features]
ca = ["consortium-log/tracing", "dep:optee-teec", "dep:tokio"]
# Opt-in `defmt` routing for TA-side builds. Not implied by `ta`: `defmt`
# requires a linked global logger, which an OP-TEE TA may not provide, and its
# macros expand to literal `defmt::` paths, hence the direct dep.
defmt   = ["consortium-log/defmt", "dep:defmt"]
default = ["ca"]
ta      = []

[dependencies]
consortium-codec      = { path = "../consortium-codec", version = "0.2.0" }
consortium-log        = { default-features = false, path = "../consortium-log", version = "0.2.0" }
consortium-tee-macros = { path = "../consortium-tee-macros", version = "0.2.0" }
defmt                 = { optional = true, version = "1.1.0" }
thiserror             = "2.0.18"
tokio                 = { default-features = false, features = ["rt"], optional = true, version = "1" }

[dev-dependencies]
trybuild = "1"

[target.'cfg(target_os = "linux")'.dependencies]
optee-teec = { optional = true, version = "0.9.0" }
