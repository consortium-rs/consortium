[package]
name = "consortium-tee"
description = "Trusted Execution Environment (TEE) support for Consortium with pluggable codec serialization via consortium_common::codec::CodecFor"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
ta = []
ca = ["dep:optee-teec", "dep:tokio"]
default = ["ca"]

[dependencies]
thiserror = "2.0.18"
consortium-tee-proc-macros = { path = "../consortium-tee-proc-macros" }
tokio = { version = "1", default-features = false, optional = true, features = [
  "rt",
] }

[dev-dependencies]
consortium-common = { path = "../consortium-common" }
trybuild = "1"

[target.'cfg(target_os = "linux")'.dependencies]
optee-teec = { version = "0.8.0", optional = true }
