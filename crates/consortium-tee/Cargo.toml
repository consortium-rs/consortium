[package]
name = "consortium-tee"
description = "Trusted Execution Environment (TEE) support for Consortium with pluggable codec serialization via consortium_common::codec::CodecFor"
version.workspace = true
edition.workspace = true
license.workspace = true


[dependencies]
thiserror = "2.0.18"
consortium-tee-proc-macros = { path = "../consortium-tee-proc-macros" }

[target.'cfg(target_os = "linux")'.dependencies]
optee-teec = "0.8.0"
tokio = { version = "1", default-features = false }
