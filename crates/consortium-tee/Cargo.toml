[package]
description       = "Trusted Execution Environment (TEE) support for Consortium with pluggable codec serialization via consortium_codec::CodecFor"
edition.workspace = true
license.workspace = true
name              = "consortium-tee"
version.workspace = true

[features]
ca      = ["dep:optee-teec", "dep:tokio"]
default = ["ca"]
ta      = []

[dependencies]
consortium-codec      = { path = "../consortium-codec" }
consortium-tee-macros = { path = "../consortium-tee-macros" }
thiserror             = "2.0.18"
tokio                 = { default-features = false, features = ["rt"], optional = true, version = "1" }

[dev-dependencies]
trybuild = "1"

[target.'cfg(target_os = "linux")'.dependencies]
optee-teec = { optional = true, version = "0.9.0" }
