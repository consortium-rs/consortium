[package]
description       = "Firmware-side glue for the Consortium UART IPC transport"
edition.workspace = true
license.workspace = true
name              = "consortium-ipc-transport-uart-embedded"
version.workspace = true

[features]
defmt = ["consortium-ipc-transport-uart/defmt"]

[dependencies]
consortium-ipc-transport-uart = { default-features = false, path = "../consortium-ipc-transport-uart" }
embedded-io-async             = { version = "0.7" }

[lints]
workspace = true
