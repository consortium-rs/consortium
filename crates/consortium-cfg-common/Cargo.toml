[package]
description       = "Schema and configuration types for Consortium"
edition.workspace = true
license.workspace = true
name              = "consortium-cfg-common"
version.workspace = true

[dependencies]
serde                = { features = ["derive"], version = "1.0.228" }
consortium-dts       = { path = "../consortium-dts" }
consortium-env-value = { path = "../consortium-env-value" }
uuid                 = { features = ["serde"], version = "1.23.4" }

[dev-dependencies]
serde_yaml = "0.9"
tempfile   = "3.8"
