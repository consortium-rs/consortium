[package]
name = "consortium-ipc-doorbell-mu"
description = "MU (Messaging Unit) Doorbell driver for Consortium IPC"
version.workspace = true
edition.workspace = true

[features]
# Chip selection — choose exactly one.  Defaults to imx93 for backwards
# compatibility.  Enabling both is a compile error.
default = ["imx95", "mua"]
imx8mp = []                # 1 MU instance (i.MX 8M Plus)
imx93 = []                 # 2 MU instances (i.MX 93)
imx95 = []                 # 8 MU instances (i.MX 95)

mua = []
mub = []

std = ["dep:tokio", "consortium-ipc/std"]

[dependencies]
consortium-ipc = { path = "../consortium-ipc", default-features = false }
atomic-waker = "1.1.2"
tokio = { version = "1", features = ["sync"], optional = true }
