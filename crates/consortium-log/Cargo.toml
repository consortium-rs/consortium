[package]
description            = "Logging facade over defmt and tracing for the Consortium project."
edition.workspace      = true
license.workspace      = true
name                   = "consortium-log"
version.workspace      = true
authors.workspace      = true
categories.workspace   = true
homepage.workspace     = true
keywords.workspace     = true
readme                 = "README.md"
repository.workspace   = true
rust-version.workspace = true

[dependencies]
consortium-log-macros = { path = "../consortium-log-macros", version = "0.2.0" }
defmt                 = { optional = true, version = "1.1.0" }
tracing               = { default-features = false, optional = true, version = "0.1" }

[features]
# `alloc` is a marker capability: `tracing` needs it, so enabling `tracing`
# turns it on. Kept separate so an `alloc`-only firmware crate can advertise the
# capability without pulling a backend.
alloc   = []
default = []
defmt   = ["dep:defmt"]
tracing = ["alloc", "dep:tracing"]

[lints]
workspace = true
