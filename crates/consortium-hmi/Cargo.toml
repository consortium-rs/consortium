[package]
edition.workspace = true
license.workspace = true
name              = "consortium-hmi"
version.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
cogcore         = { path = "../cogcore", version = "^0.1" }
futures-channel = "0.3"
futures-util    = "0.3"
serde           = { features = ["derive"], version = "1" }
serde_json      = "1"
tokio           = { features = ["rt"], version = "1" }

[lints]
workspace = true
