[package]
description       = "Consortium HAL for STM32MP2 family devices"
edition.workspace = true
license.workspace = true
name              = "consortium-hal-stm32mp2"
version.workspace = true

[features]
default = [
  "adc",
  "can",
  "defmt",
  "dma",
  "gpio",
  "i2c",
  "lptim",
  "spi",
  "stm32mp25x",
  "time-driver-gp-tim",
  "timer",
  "uart",
]
# Chip selection — forwarded to the PAC. Choose exactly one. STM32MP23 and
# STM32MP25 share one interrupt/peripheral layout, so both map to the PAC's
# `stm32mp257` chip. Dependents that select a different chip must set
# `default-features = false` so the default `stm32mp25x` is not also pulled in.
stm32mp21x = ["consortium-pac-stm32mp2/stm32mp21"]
stm32mp23x = ["consortium-pac-stm32mp2/stm32mp257"]
stm32mp25x = ["consortium-pac-stm32mp2/stm32mp257"]
# Forward cortex-m-rt runtime support (vector table, `#[interrupt]`) to the PAC.
rt   = ["consortium-pac-stm32mp2/rt"]
adc  = []
can  = ["dep:critical-section", "dep:embassy-sync", "dep:embedded-can", "dep:nb"]
dma  = ["dep:critical-section", "dep:embassy-sync"]
gpio = ["dep:embassy-sync", "dep:embedded-hal"]
i2c  = ["dep:critical-section", "dep:embassy-sync", "dep:embedded-hal", "dep:embedded-hal-async"]
# Compatibility alias for the former top-level PWM feature.
pwm = ["timer"]
spi = ["dep:critical-section", "dep:embassy-sync", "dep:embedded-hal", "dep:embedded-hal-async"]
timer = ["dep:embedded-hal"]
lptim = ["dep:embassy-sync", "timer"]
time-driver-gp-tim = [
  "dep:critical-section",
  "dep:embassy-sync",
  "dep:embassy-time-driver",
  "dep:embassy-time-queue-utils",
]
uart = [
  "dep:critical-section",
  "dep:embassy-hal-internal",
  "dep:embassy-sync",
  "dep:embedded-hal-nb",
  "dep:embedded-io",
  "dep:embedded-io-async",
]
defmt = ["consortium-log/defmt", "dep:defmt"]

[dependencies]
consortium-hal           = { path = "../consortium-hal" }
consortium-pac-stm32mp2  = { default-features = false, path = "../consortium-pac-stm32mp2" }
consortium-log           = { path = "../consortium-log" }
critical-section         = { optional = true, version = "1.2.0" }
embassy-hal-internal     = { optional = true, version = "0.5.0" }
embassy-sync             = { optional = true, version = "0.8.0" }
embassy-time-driver      = { optional = true, version = "0.2.2" }
embassy-time-queue-utils = { optional = true, version = "0.3.2" }
embedded-can             = { optional = true, version = "0.4.1" }
embedded-hal             = { optional = true, version = "1.0.0" }
embedded-hal-async       = { optional = true, version = "1.0.0" }
embedded-hal-nb          = { optional = true, version = "1.0.0" }
nb                       = { optional = true, version = "1.1.0" }
embedded-io              = { optional = true, version = "0.7" }
embedded-io-async        = { optional = true, version = "0.7" }
defmt                    = { optional = true, version = "1" }

[dev-dependencies]
# Supplies a host `critical_section` implementation so the buffered-UART IRQ
# path can be exercised in unit tests.
critical-section = { features = ["std"], version = "1.2.0" }

[lints]
workspace = true
