[workspace]
members = ["crates/*", "examples/melt-pot/shared"]
# The per-endpoint example crates are built by the `consortium` build pipeline,
# not plain `cargo build`: each `include!`s a generated `src/consortium.gen.rs`
# and builds into its own per-crate `target/` (matching the pipeline's ELF-path
# resolution). Excluding them keeps `cargo check`/`just check` on the workspace
# from requiring those generated modules to be present. The `shared` crate has
# no generated code and stays a member so host checks cover it.
exclude = [
  "examples/melt-pot/imx93/app",
  "examples/melt-pot/imx93/mcu",
  "examples/melt-pot/imx93/ta",
  "examples/melt-pot/imx95/app",
  "examples/melt-pot/imx95/mcu",
  "examples/melt-pot/imx95/ta",
  "examples/melt-pot/stm32mp25/app",
  "examples/melt-pot/stm32mp25/mcu",
  "examples/melt-pot/stm32mp25/ta",
  # PocketJS contains its own Cargo workspaces; path dependencies from the HMI
  # adapter must inherit those manifests rather than this outer workspace.
  "submodules/pocketjs",
]
resolver = "2"

# `cargo shear` walks each crate's source tree looking for files no `mod`/`include!`
# reaches. Every `tests/ui/**` file is a trybuild fixture: trybuild compiles them at
# test time from a harness that names them by path, so they are unreachable from the
# module graph by design and are not dead code.
[workspace.metadata.cargo-shear]
ignored-paths = ["**/tests/ui/**/*.rs"]

[workspace.package]
authors    = ["Ethan Wu <7086cmd@gmail.com>"]
categories = ["embedded", "hardware-support", "no-std"]
edition    = "2024"
homepage   = "https://github.com/consortium-rs/consortium"
keywords   = ["amp", "embedded", "heterogeneous", "ipc", "no-std"]
license    = "Apache-2.0"
readme     = "README.md"
repository = "https://github.com/consortium-rs/consortium"
# Edition 2024 needs 1.85; `u64::is_multiple_of` (consortium-cfg) needs 1.87.
# clippy's `incompatible_msrv` lint checks this on every `just lint` run.
rust-version = "1.87"
version      = "0.4.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
multiple_unsafe_ops_per_block = "deny"
undocumented_unsafe_blocks    = "deny"
unnecessary_safety_comment    = "deny"
unnecessary_safety_doc        = "deny"

[workspace.dependencies]
embedded-hal = "1.0"

[profile.dev]
lto       = false
opt-level = 1
debug     = true  # keep DWARF info
strip     = false # don't strip the binary

[profile.release]
lto       = true
opt-level = 1
panic     = "abort"
