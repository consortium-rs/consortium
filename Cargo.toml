[workspace]
members = [
  "crates/consortium-ipc",
  "crates/consortium-cli",
  "crates/consortium-ipc-transport-uio",
  "crates/consortium-ipc-transport-mem",
  "crates/consortium-ipc-doorbell-hsem",
  "crates/consortium-ipc-doorbell-mu",
  "crates/consortium-runtime-mcu",
  "crates/consortium-runtime-app",
  "crates/consortium-builder",
  "crates/consortium-common",
  "crates/consortium-tee",
  "crates/consortium-tee-proc-macros",
  "crates/consortium-ffi",
  "crates/consortium-hmi",
  "crates/consortium-ort",
  "crates/consortium-codec-postcard",
  "crates/consortium-codec-prost",
  "crates/consortium-codec-rkyv",
  "crates/consortium-ipc-doorbell-gpio",
  "crates/consortium-tee-test",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"

[workspace.dependencies]
