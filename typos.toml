[files]
extend-exclude = [
  "crates/cogcore-sys/src/bindings_pregenerated.rs",
  "crates/cogcore-sys/vendor",
  # Vendored chip databases and upstream Linux device trees.
  "crates/consortium-data/database",
  # Generated PAC register/interrupt sources, and the chip HAL singleton maps
  # `scripts/pac/gen_peripherals.py` emits from the same dumps, reproduce vendor
  # header names and descriptions verbatim.
  "crates/consortium-hal-imx9/src/peripherals",
  "crates/consortium-hal-stm32mp2/src/peripherals",
  "crates/consortium-pac-imx9/src/interrupts",
  "crates/consortium-pac-imx9/src/peripherals",
  "crates/consortium-pac-stm32mp2/src/interrupts",
  "crates/consortium-pac-stm32mp2/src/peripherals",
  "data/stm32mp",
  "dialogs",
  # Vendor reference sources (STM32Cube drivers, MCUX board files).
  "references",
  "scripts/.venv",
  "scripts/pac/patches",                # vendor CMSIS text and git blob hashes
  "sim/renode/stm32mp257/firmware.elf",
  "submodules",
  "target",
]

[default.extend-words]
# `DAA`/`daa` is the I3C spec term "Dynamic Address Assignment"; `EXTEN` (ADC
# CFGR external-trigger enable) and `TIMOUT` (LPTIM CFGR timeout enable) are
# STM32MP2/i.MX9 register field names mirrored from the generated PAC crates.
DAA      = "DAA"
EXTEN    = "EXTEN"
GIPn     = "GIPn"
GIR      = "GIR"
Iinclude = "Iinclude"
MIS      = "MIS"
Pn       = "Pn"
PARM     = "PARM"
SISE     = "SISE"
Siz      = "Siz"
TIMOUT   = "TIMOUT"
UE       = "UE"
daa      = "daa"
ddress   = "ddress"
fpr      = "fpr"
hsi      = "hsi"
parm     = "parm"
sems     = "sems"
