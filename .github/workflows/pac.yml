name: PAC - Parse and Validate

# No `paths` filter: `parse-and-validate (3.12)` is a required check, and a
# workflow filtered out by `paths` never reports, which leaves every PR that
# does not touch the PAC pipeline waiting on it. The job always runs and
# fast-passes instead when nothing it covers changed.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# `dorny/paths-filter` lists a PR's changed files through the API.
permissions:
  contents: read
  pull-requests: read

jobs:
  parse-and-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      # Submodules are fetched only once the filter says the pipeline must run,
      # so a fast pass costs a shallow checkout.
      - uses: actions/checkout@v4

      - name: Detect PAC changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            pac:
              - 'scripts/pac/**'
              - 'submodules/**'
              - '.gitmodules'
              - '.github/workflows/pac.yml'

      - name: Fast pass
        if: steps.filter.outputs.pac != 'true'
        run: echo "No PAC pipeline inputs changed; skipping parse and validate."

      - name: Fetch submodules
        if: steps.filter.outputs.pac == 'true'
        run: git submodule update --init --recursive --depth 1

      - name: Set up Python
        if: steps.filter.outputs.pac == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install chiptool
        if: steps.filter.outputs.pac == 'true'
        # Pinned: chiptool stamps its revision into every generated file. Keep in
        # step with `chiptool_rev` in the justfile.
        run: cargo install --git https://github.com/embassy-rs/chiptool --rev bcf538a2e7b8584ae874ee9ab72efb1576fc6152 --locked

      - name: Install Python dependencies
        if: steps.filter.outputs.pac == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Apply vendor-header patches
        if: steps.filter.outputs.pac == 'true'
        # Same patches `just pac-patch` applies; `ir/` and `generated/` patch
        # pipeline outputs, not submodules.
        run: |
          for dir in scripts/pac/patches/*/; do
            submodule=$(basename "$dir")
            case "$submodule" in ir|generated) continue ;; esac
            for patch in "$dir"*.diff; do
              git -C "submodules/$submodule" apply --ignore-whitespace "$(pwd)/$patch"
            done
          done

      - name: Stage vendor headers
        if: steps.filter.outputs.pac == 'true'
        run: bash scripts/pac/prepare.sh

      - name: Run PAC pipeline
        if: steps.filter.outputs.pac == 'true'
        run: |
          python scripts/pac/parse_stm32.py --all
          python scripts/pac/parse_nxp.py --all
          python scripts/pac/parse_signals_stm32.py --all
          python scripts/pac/parse_signals_nxp.py --all
          python scripts/pac/test_output.py

      - name: Validate with chiptool
        if: steps.filter.outputs.pac == 'true'
        run: |
          python scripts/pac/validate_with_chiptool.py

      - name: Show summary
        run: |
          bash scripts/pac/test_summary.sh
        if: always() && steps.filter.outputs.pac == 'true'
