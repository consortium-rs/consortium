name: PAC - Parse and Validate

on:
  push:
    branches: [main, develop]
    paths:
      - 'scripts/pac/**'
      - 'submodules/**'
      - '.github/workflows/pac.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/pac/**'
      - 'submodules/**'

jobs:
  parse-and-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install chiptool
        run: cargo install --git https://github.com/embassy-rs/chiptool --locked

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Stage vendor headers
        run: bash scripts/pac/prepare.sh

      - name: Run PAC pipeline
        run: |
          python scripts/pac/parse_stm32.py --all
          python scripts/pac/parse_nxp.py --all
          python scripts/pac/test_output.py

      - name: Validate with chiptool
        run: |
          python scripts/pac/validate_with_chiptool.py
        continue-on-error: true

      - name: Show summary
        run: |
          bash scripts/pac/test_summary.sh
        if: always()
