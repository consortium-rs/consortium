name: linters

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linters:
    name: all linters
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: Install Rust linters
        run: |
          cargo install taplo-cli --locked
          cargo install typos-cli --locked

      - name: Install OP-TEE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison build-essential ccache device-tree-compiler expect flex \
            libcap-dev libssl-dev python3-pycryptodome python3-pyelftools \
            uuid-dev

      - name: Cache Teaclave TrustZone SDK
        id: cache-optee
        uses: actions/cache@v4
        with:
          path: ~/teaclave-trustzone-sdk
          key: teaclave-optee-${{ runner.os }}-v1

      - name: Build OP-TEE libraries (Teaclave TrustZone SDK)
        if: steps.cache-optee.outputs.cache-hit != 'true'
        run: |
          # teaclave-trustzone-sdk's setup.sh calls bare `apt` (not `apt-get`)
          # without sudo, which fails on runners where the job user isn't root.
          # Shim `apt` to auto-elevate, scoped to this step via PATH only.
          mkdir -p "$HOME/.local/bin"
          printf '%s\n' '#!/bin/bash' 'exec sudo /usr/bin/apt "$@"' > "$HOME/.local/bin/apt"
          chmod +x "$HOME/.local/bin/apt"
          export PATH="$HOME/.local/bin:$PATH"

          git clone --depth 1 https://github.com/apache/teaclave-trustzone-sdk.git "$HOME/teaclave-trustzone-sdk"
          cd "$HOME/teaclave-trustzone-sdk"
          ./setup.sh
          ./build_optee_libraries.sh optee/

      - name: Export OP-TEE environment
        run: |
          {
            echo "OPTEE_DIR=$HOME/teaclave-trustzone-sdk/optee"
            echo "TA_DEV_KIT_DIR=$HOME/teaclave-trustzone-sdk/optee/optee_os/out/arm-plat-vexpress/export-ta_arm64"
            echo "OPTEE_CLIENT_EXPORT=$HOME/teaclave-trustzone-sdk/optee/optee_client/export_arm64"
          } >> "$GITHUB_ENV"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Setup vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - name: Install Vite+ dependencies
        run: vp install

      - name: Run linters
        run: |
          source "$HOME/teaclave-trustzone-sdk/environment"
          just lint
