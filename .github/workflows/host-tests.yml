name: host tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: host crate tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Debug logging tests
        run: cargo test -p consortium-dbg-defmt

      - name: IPC core tests
        run: cargo test -p consortium-ipc --features std

      - name: IPC shared-memory transport tests
        run: cargo test -p consortium-ipc-transport-memory

      - name: TEE tests
        run: cargo test -p consortium-tee

      - name: TEE macro snapshot tests
        run: cargo test -p consortium-tee-macros-impl --test snap
