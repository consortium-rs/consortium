name: host tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: host crate tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: Debug logging tests
        run: just test dbg host

      - name: Codec tests
        run: just test codec host

      - name: Configuration tests
        run: just test cfg host

      - name: IPC tests
        run: just test ipc host

      - name: TEE tests
        run: just test tee host
