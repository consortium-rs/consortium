name: Generate cogcore bindings

on:
  workflow_dispatch:
  push:
    paths:
      - 'crates/libcogcore-sys/vendor/include/**'
      - 'crates/libcogcore-sys/wrapper.h'
      - 'crates/libcogcore-sys/build.rs'
      - '.github/workflows/cogcore.yml'

jobs:
  generate:
    runs-on: ubuntu-22.04-arm
    env:
      COG_BUILD_DIR: /tmp/cog/build/core
    permissions:
      contents: write # required for pushing commits
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libwpewebkit-1.0-dev \
            libwpebackend-fdo-1.0-dev \
            libportal-dev \
            libepoxy-dev \
            libdrm-dev \
            clang llvm meson ninja-build \
            libinput-dev \
            libcairo2-dev \
            libwayland-dev \
            libwayland-client0 \
            libwayland-egl1 \
            libwayland-cursor0 \
            wayland-protocols \
            libgbm-dev

      - name: Build cogcore
        run: |
          git clone --branch v0.18.5 --depth 1 --tags https://github.com/Igalia/cog.git /tmp/cog
          cd /tmp/cog
          meson setup build --prefix=/usr || cat build/meson-logs/meson-log.txt
          sudo ninja -C build install

      - name: Copy build files
        run: cp /usr/include/cog/*.h crates/libcogcore-sys/vendor/include/

      - name: Generate bindings
        run: cargo build -p libcogcore-sys

      - name: Copy bindings
        run: |
          cp target/debug/build/libcogcore-sys-*/out/bindings.rs \
             crates/libcogcore-sys/src/bindings_pregenerated.rs

      - name: Commit bindings
        uses: stefanzweifel/git-auto-commit-action@v7.1.0
        with:
          commit_message: 'chore: regenerate cogcore bindings'
          file_pattern: crates/libcogcore-sys/src/bindings_pregenerated.rs
          token: ${{ secrets.GITHUB_TOKEN }}
