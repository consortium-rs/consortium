# This crate is built by the `consortium` build pipeline, which writes the
# generated `src/consortium.gen.rs` (UIO bring-up, IPC transceivers, defmt
# console) this application `include!`s, then compiles it. It is intentionally
# excluded from the workspace so it builds into its own per-crate `target/`.
[package]
description = "melt-pot Linux application for i.MX93 Cortex-A55"
edition     = "2024"
license     = "Apache-2.0"
name        = "melt-pot-imx93-app"
version     = "0.4.0"

# Cross-compile target: aarch64-unknown-linux-gnu  (Cortex-A55, 64-bit Linux)
# Built via `consortium build --manifest ../Consortium.toml`.

[[bin]]
name = "melt-pot-imx93-app"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
melt-pot-shared = { path = "../../shared", version = "0.4.0" }
melt-pot-imx93-ta = { default-features = false, features = [
  "ca",
], path = "../ta", version = "0.4.0" }

# Named directly by the generated `consortium.gen.rs`.
consortium-codec = { features = [
  "postcard",
], path = "../../../../crates/consortium-codec", version = "0.4.0" }
consortium-ipc = { features = [
  "std",
], path = "../../../../crates/consortium-ipc", version = "0.4.0" }
# `default-features = false` is load-bearing: the doorbell's default is
# `mimx95`, and cargo would unify it with the `mimx93` selected below into a
# both-chips build, which the crate rejects with a `compile_error!`.
consortium-ipc-transport-memory = { features = [
  "mimx93",
  "std",
], path = "../../../../crates/consortium-ipc-transport-memory", version = "0.4.0" }
consortium-shared-memory = { path = "../../../../crates/consortium-shared-memory", version = "0.4.0" }
consortium-runtime-app = { features = [
  "mimx93",
], path = "../../../../crates/consortium-runtime-app", version = "0.4.0" }

# Application runtime.
consortium-tee = { default-features = false, features = [
  "ca",
], path = "../../../../crates/consortium-tee", version = "0.4.0" }
consortium-hmi-webkit = { path = "../../../../crates/consortium-hmi-webkit", version = "0.4.0" }

glib       = "0.22"
optee-teec = "0.9.0"
serde      = { features = ["derive"], version = "1" }
serde_json = "1"
tokio      = { features = ["macros", "rt-multi-thread", "sync"], version = "1" }
