[build]
target = "thumbv8m.main-none-eabihf"

# [target.thumbv8m.main-none-eabi]
# rustflags = [
#   # `--nmagic` disables page-alignment of output segments, keeping the linked
#   # firmware compact (no 64 KiB padding gaps) — matches the embassy examples and
#   # suits a remoteproc SRAM-carveout image.
#   "-C",
#   "link-arg=--nmagic",
#   # `Tlink.x` is required for embassy-time.
#   "-C",
#   "link-arg=-Tlink.x",
#   # `defmt.x` is required by defmt: it lays out the interned-string table the
#   # decoder relies on. Must come after `link.x`.
#   "-C",
#   "link-arg=-Tdefmt.x",
# ]

[env]
# defmt's compile-time filter defaults to `error` when DEFMT_LOG is unset, which
# would drop the `defmt::info!` sensor stream this firmware exists to emit; the
# CA35 decodes it from the CDBG ring described by `[dbg.cm33]`.
#
# `trace` stays on for this crate (generated init, HIL stages), the IPC
# transport and the runtime. Everything else, the HAL included, is `info`: the
# time driver traces every timer interrupt, which floods the 8 KiB ring in
# moments while nothing drains it before the AP application starts.
DEFMT_LOG = "info,melt_pot_stm32mp25_mcu=trace,consortium_ipc_transport_memory=trace,consortium_runtime_mcu=trace"
