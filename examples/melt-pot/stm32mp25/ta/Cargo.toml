# Excluded from the workspace (built by the `consortium` pipeline / as a `ca`
# path-dependency of the app), so package metadata is spelled out here.
[package]
description = "melt-pot OP-TEE trusted application for STM32MP25"
edition     = "2024"
license     = "Apache-2.0"
name        = "melt-pot-stm32mp25-ta"
version     = "0.1.0"

# `ta` — TA-side dispatch; pulls in optee-utee.
# `ca` — CA-side callers generated by #[tee_command]; pulls in optee-teec.
[features]
ca      = ["consortium-tee/ca", "dep:optee-teec"]
default = []
ta      = ["consortium-tee/ta", "dep:optee-utee", "optee-utee/unwind_stubs", "dep:optee-utee-sys"]

# `lib` (rlib) — the `ca` callers linked into the Linux app.
# `lib` (staticlib) + `bin` — the OP-TEE TA ELF built for the Secure World.
[lib]
crate-type = ["rlib", "staticlib"]
name       = "melt_pot_stm32mp25_ta"
path       = "src/lib.rs"

[[bin]]
name              = "melt_pot_stm32mp25_ta"
path              = "src/main.rs"
required-features = ["ta"]

[target.'cfg(target_os = "linux")'.dependencies]
consortium-tee = { default-features = false, path = "../../../../crates/consortium-tee" }
optee-teec     = { optional = true, version = "0.9.0" }
optee-utee     = { default-features = false, optional = true, version = "0.9.0" }
optee-utee-sys = { default-features = false, optional = true, version = "0.9.0" }

[target.'cfg(target_os = "linux")'.build-dependencies]
consortium-cfg-common = { path = "../../../../crates/consortium-cfg-common" }
optee-utee-build      = "0.9.0"
