[package]
description       = "melt-pot OP-TEE trusted application for i.MX95"
edition.workspace = true
license.workspace = true
name              = "melt-pot-imx95-ta"
version.workspace = true

# `ta`  (default) — TA-side dispatch; pulls in optee-utee.
# `ca`            — CA-side callers generated by #[tee_command]; pulls in optee-teec.
[features]
ca      = ["consortium-tee/ca", "dep:optee-teec"]
default = ["ta"]
ta      = ["dep:optee-utee", "dep:optee-utee-sys"]

[target.'cfg(target_os = "linux")'.dependencies]
consortium-tee = { default-features = false, features = ["ta"], path = "../../../../crates/consortium-tee" }
optee-teec     = { optional = true, version = "0.8.0" }
optee-utee     = { default-features = false, optional = true, version = "0.8.0" }
optee-utee-sys = { default-features = false, optional = true, version = "0.8.0" }

[target.'cfg(target_os = "linux")'.build-dependencies]
optee-utee-build = "0.8.0"

[lints]
workspace = true
