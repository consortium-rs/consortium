# This crate is built by the `consortium` build pipeline, which writes the
# generated `src/consortium.gen.rs` (IPC endpoints + MPU/NVIC bring-up) this
# firmware `include!`s, then cross-compiles it. It is intentionally excluded
# from the workspace so it builds into its own per-crate `target/`.
[package]
description = "melt-pot MCU firmware for i.MX95 Cortex-M7"
edition     = "2024"
license     = "Apache-2.0"
name        = "melt-pot-imx95-mcu"
version     = "0.1.0"

# Cross-compile target: thumbv7em-none-eabihf  (Cortex-M7)
# Built via `consortium build --manifest ../Consortium.toml`.

[[bin]]
name = "melt-pot-imx95-mcu"
path = "src/main.rs"

[dependencies]
melt-pot-shared = { path = "../../shared" }

# Named directly by the generated `consortium.gen.rs`.
consortium-codec = { default-features = false, features = [
  "postcard",
], path = "../../../../crates/consortium-codec" }
consortium-ipc = { default-features = false, path = "../../../../crates/consortium-ipc" }
consortium-ipc-doorbell-mu = { default-features = false, features = [
  "mimx95",
], path = "../../../../crates/consortium-ipc-doorbell-mu" }
consortium-ipc-transport-memory = { default-features = false, features = [
  "mimx95",
], path = "../../../../crates/consortium-ipc-transport-memory" }
consortium-shared-memory = { path = "../../../../crates/consortium-shared-memory" }
consortium-runtime-mcu = { default-features = false, path = "../../../../crates/consortium-runtime-mcu" }
consortium-hal-imx9 = { default-features = false, features = [
  "gpio",
  "i2c",
  "rt",
  "time-driver-lpit",
], path = "../../../../crates/consortium-hal-imx9" }

# Firmware runtime.
consortium-dbg = { default-features = false, features = [
  "logger",
], path = "../../../../crates/consortium-dbg" }
cortex-m = { features = ["critical-section-single-core"], version = "0.7" }
cortex-m-rt = "0.7"
defmt = "1.1.0"
embassy-executor = { default-features = false, features = [
  "executor-thread",
  "platform-cortex-m",
], version = "0.10.0" }
embassy-time = { default-features = false, features = ["tick-hz-24_000_000"], version = "0.5.1" }
panic-halt = "0.2"

[profile.dev]
panic = "abort"

[profile.release]
lto   = true
panic = "abort"
