[package]
description       = "melt-pot MCU firmware for i.MX95 Cortex-M7"
edition.workspace = true
license.workspace = true
name              = "melt-pot-imx95-mcu"
version.workspace = true

# Cross-compile target: thumbv7em-none-eabihf  (Cortex-M7)
# Example: cargo build -p melt-pot-imx95-mcu --features firmware --target thumbv7em-none-eabihf --release

[features]
default = []
firmware = [
  "dep:consortium-codec",
  "dep:consortium-dbg-defmt",
  "dep:consortium-ipc",
  "dep:consortium-ipc-doorbell-mu",
  "dep:consortium-ipc-transport-memory",
  "dep:cortex-m",
  "dep:cortex-m-rt",
  "dep:defmt",
  "dep:embassy-executor",
  "dep:panic-halt",
  "dep:melt-pot-shared",
]

[[bin]]
name = "melt-pot-imx95-mcu"
path = "src/main.rs"
required-features = ["firmware"]

[dependencies]
melt-pot-shared = { optional = true, path = "../../shared" }

consortium-codec                 = { optional = true, default-features = false, features = ["postcard"], path = "../../../../crates/consortium-codec" }
consortium-dbg-defmt             = { optional = true, default-features = false, features = ["logger"], path = "../../../../crates/consortium-dbg-defmt" }
consortium-ipc                   = { optional = true, default-features = false, path = "../../../../crates/consortium-ipc" }
consortium-ipc-doorbell-mu       = { optional = true, default-features = false, features = ["imx95", "mub"], path = "../../../../crates/consortium-ipc-doorbell-mu" }
consortium-ipc-transport-memory  = { optional = true, default-features = false, path = "../../../../crates/consortium-ipc-transport-memory" }

cortex-m            = { optional = true, version = "0.7" }
cortex-m-rt         = { optional = true, version = "0.7" }
defmt               = { optional = true, version = "1.1.0" }
embassy-executor    = { optional = true, default-features = false, features = ["executor-thread", "platform-cortex-m"], version = "0.10.0" }
panic-halt          = { optional = true, version = "0.2" }

[lints]
workspace = true
