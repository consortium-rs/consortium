[package]
description       = "melt-pot Linux application for i.MX95 Cortex-A55"
edition.workspace = true
license.workspace = true
name              = "melt-pot-imx95-app"
version.workspace = true

# Cross-compile target: aarch64-unknown-linux-gnu  (Cortex-A55, 64-bit Linux)
# Example: cargo build -p melt-pot-imx95-app --target aarch64-unknown-linux-gnu --release

[[bin]]
name = "melt-pot-imx95-app"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
melt-pot-shared   = { path = "../../shared" }
melt-pot-imx95-ta = { default-features = false, features = ["ca"], path = "../ta" }

consortium-codec = { features = ["postcard"], path = "../../../../crates/consortium-codec" }
consortium-dbg-defmt = { default-features = false, features = [
  "host",
], path = "../../../../crates/consortium-dbg-defmt" }
consortium-tee = { default-features = false, features = [
  "ca",
], path = "../../../../crates/consortium-tee" }
consortium-ipc = { features = ["std"], path = "../../../../crates/consortium-ipc" }
consortium-ipc-doorbell-mu = { features = [
  "imx95",
  "mua",
  "std",
], path = "../../../../crates/consortium-ipc-doorbell-mu" }
consortium-ipc-transport-memory = { path = "../../../../crates/consortium-ipc-transport-memory" }
consortium-hmi = { path = "../../../../crates/consortium-hmi" }

glib       = "0.22"
optee-teec = "0.8.0"
serde      = { features = ["derive"], version = "1" }
serde_json = "1"
tokio      = { features = ["macros", "rt-multi-thread", "sync"], version = "1" }

[lints]
workspace = true
