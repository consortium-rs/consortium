# This crate is built by the `consortium` build pipeline, which writes the
# generated `src/consortium.gen.rs` (UIO bring-up, IPC transceivers, defmt
# console) this application `include!`s, then compiles it. It is intentionally
# excluded from the workspace so it builds into its own per-crate `target/`.
[package]
description = "melt-pot Linux application for i.MX95 Cortex-A55"
edition     = "2024"
license     = "Apache-2.0"
name        = "melt-pot-imx95-app"
version     = "0.1.0"

# Cross-compile target: aarch64-unknown-linux-gnu  (Cortex-A55, 64-bit Linux)
# Built via `consortium build --manifest ../Consortium.toml`.

[[bin]]
name = "melt-pot-imx95-app"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
melt-pot-shared   = { path = "../../shared" }
melt-pot-imx95-ta = { default-features = false, features = ["ca"], path = "../ta" }

# Named directly by the generated `consortium.gen.rs`.
consortium-codec = { features = ["postcard"], path = "../../../../crates/consortium-codec" }
consortium-ipc = { features = ["std"], path = "../../../../crates/consortium-ipc" }
consortium-ipc-doorbell-mu = { features = [
  "std",
], path = "../../../../crates/consortium-ipc-doorbell-mu" }
consortium-ipc-transport-memory = { features = [
  "imx95",
  "std",
], path = "../../../../crates/consortium-ipc-transport-memory" }
consortium-shared-memory = { path = "../../../../crates/consortium-shared-memory" }
consortium-runtime-app = { features = [
  "imx95",
], path = "../../../../crates/consortium-runtime-app" }

# Application runtime.
consortium-tee = { default-features = false, features = [
  "ca",
], path = "../../../../crates/consortium-tee" }
consortium-hmi = { path = "../../../../crates/consortium-hmi" }

glib       = "0.22"
optee-teec = "0.9.0"
serde      = { features = ["derive"], version = "1" }
serde_json = "1"
tokio      = { features = ["macros", "rt-multi-thread", "sync"], version = "1" }
